<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="数学星球">
<title>数学星球</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0d0d1e;--card:rgba(255,255,255,.08);--border:rgba(255,255,255,.14);
  --text:#f0f0ff;--dim:rgba(240,240,255,.5);
  --y:#FFD93D;--o:#FF6B35;--g:#6BCB77;--r:#FF4757;--c:#4ECDC4;--b:#4CC9F0;--p:#C77DFF;
  --fd:'Baloo 2',cursive;--fb:'Nunito',sans-serif
}
html,body{height:100%;overflow:hidden}
body{font-family:var(--fb);background:var(--bg);color:var(--text);display:flex;flex-direction:column}

/* stars */
#bg{position:fixed;inset:0;z-index:0;
  background:radial-gradient(ellipse at 20% 30%,rgba(76,201,240,.1) 0%,transparent 55%),
             radial-gradient(ellipse at 80% 70%,rgba(199,125,255,.1) 0%,transparent 55%),
             linear-gradient(160deg,#0d0d1e 0%,#141428 60%,#0d1a2e 100%)}
#bg::after{content:'';position:fixed;inset:0;
  background-image:
    radial-gradient(1px 1px at 15% 20%,#fff 0%,transparent 100%),
    radial-gradient(1px 1px at 35% 55%,rgba(255,255,255,.7) 0%,transparent 100%),
    radial-gradient(2px 2px at 55% 15%,#fff 0%,transparent 100%),
    radial-gradient(1px 1px at 70% 40%,rgba(255,255,255,.8) 0%,transparent 100%),
    radial-gradient(1px 1px at 85% 70%,rgba(255,255,255,.6) 0%,transparent 100%),
    radial-gradient(1px 1px at 25% 80%,rgba(255,255,255,.5) 0%,transparent 100%),
    radial-gradient(1px 1px at 90% 25%,rgba(255,255,255,.7) 0%,transparent 100%),
    radial-gradient(1px 1px at 48% 90%,rgba(255,255,255,.4) 0%,transparent 100%);
  animation:twinkle 3s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.5}to{opacity:1}}

/* app shell */
#app{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;overflow:hidden}
.screen{display:none;flex:1;flex-direction:column;align-items:center;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 16px 40px}
.screen.on{display:flex}

/* ── HOME ── */
.home-hero{text-align:center;padding:24px 0 16px}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.app-title{font-family:var(--fd);font-size:clamp(2rem,8vw,3rem);font-weight:800;
  background:linear-gradient(135deg,var(--y),var(--o),#FF6B9D);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-top:6px}
.app-sub{color:var(--dim);font-size:.9rem;margin-top:4px;font-weight:700}
.mod-grid{width:100%;max-width:440px;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.mod-card{background:var(--card);border:1px solid var(--border);border-radius:18px;
  padding:14px 10px;cursor:pointer;text-align:center;transition:transform .15s;backdrop-filter:blur(10px);position:relative}
.mod-card:active{transform:scale(.93)}
.mod-card .ico{font-size:30px;display:block;margin-bottom:5px}
.mod-card .nm{font-family:var(--fd);font-size:.95rem;font-weight:800}
.mod-card .mod-en{font-size:.62rem;color:#a78bfa;font-weight:700;letter-spacing:.04em;margin-top:1px;font-family:var(--fb)}
.mod-card .sb{font-size:.66rem;color:var(--dim);margin-top:2px}
/* level card bilingual */
.lv-en{font-size:.68rem;color:#a78bfa;font-weight:700;font-family:var(--fb);margin-top:1px;letter-spacing:.03em}
/* grade tab bilingual */
.gt-en{font-size:.58rem;color:rgba(255,255,255,.55);font-weight:700;font-family:var(--fb);display:block;margin-top:1px}
.gt-btn.sel .gt-en{color:rgba(0,0,0,.55)}
/* question label bilingual */
.q-lbl-en{font-size:.6rem;color:#a78bfa;font-weight:700;font-family:var(--fb);margin-left:4px;letter-spacing:.04em}
.mod-card .lvc{position:absolute;top:6px;right:8px;font-size:.62rem;color:var(--dim);font-weight:700}
.mod-card.empty{opacity:.35;pointer-events:none}
/* grade tabs */
.grade-tabs{width:100%;max-width:440px;display:flex;gap:6px;margin-top:8px;justify-content:center;flex-wrap:wrap}
.gt-btn{background:var(--card);border:1.5px solid var(--border);color:var(--text);border-radius:50px;padding:7px 14px;font-family:var(--fd);font-size:.82rem;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:5px;transition:all .15s}
.gt-btn:active{transform:scale(.94)}
.gt-btn.sel{background:linear-gradient(135deg,var(--y),var(--o));color:#111;border-color:transparent;box-shadow:0 4px 14px rgba(255,217,61,.35)}
.gt-btn .gt-sub{font-size:.62rem;font-weight:700;opacity:.7}
.gt-btn.sel .gt-sub{opacity:.85}
.total-stars{margin-top:24px;text-align:center;color:var(--dim);font-size:.82rem}
.total-stars b{font-family:var(--fd);font-size:1.4rem;font-weight:800;color:var(--text);display:block;margin-top:2px}

/* ── LEVEL SELECT ── */
.back-btn{align-self:flex-start;background:var(--card);border:1px solid var(--border);
  color:var(--text);border-radius:50px;padding:8px 18px;font-size:.88rem;
  font-family:var(--fb);font-weight:800;cursor:pointer;transition:transform .13s}
.back-btn:active{transform:scale(.93)}
.s-title{font-family:var(--fd);font-size:clamp(1.5rem,6vw,2rem);font-weight:800;margin:14px 0 3px;text-align:center}
.s-sub{color:var(--dim);font-size:.82rem;text-align:center;margin-bottom:16px}
.lv-list{width:100%;max-width:400px;display:flex;flex-direction:column;gap:10px}
.lv-card{background:var(--card);border:1px solid var(--border);border-radius:18px;
  padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;
  transition:transform .15s;position:relative;overflow:hidden}
.lv-card:active{transform:scale(.96)}
.lv-card.locked{opacity:.3;pointer-events:none}
.lv-glow{position:absolute;right:-20px;top:-20px;width:70px;height:70px;
  border-radius:50%;opacity:.1;filter:blur(16px)}
.lv-ico{font-size:28px;flex-shrink:0}
.lv-inf{flex:1}
.lv-nm{font-family:var(--fd);font-size:.97rem;font-weight:800}
.lv-ds{font-size:.72rem;color:var(--dim);margin-top:2px}
.lv-stars{font-size:.9rem;letter-spacing:2px}
.lv-sc{font-size:.68rem;font-weight:800;color:#111;border-radius:8px;padding:2px 8px;margin-top:3px;display:inline-block}

/* ── GAME ── */
.g-head{width:100%;max-width:720px;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.g-score{font-family:var(--fd);font-size:1rem;font-weight:800;background:var(--card);
  border:1px solid var(--border);border-radius:50px;padding:6px 14px;display:flex;align-items:center;gap:5px}
.streak-pill{border-radius:50px;padding:2px 9px;font-size:.72rem;font-weight:800;color:#111}
.prog-track{width:100%;max-width:720px;height:8px;background:rgba(255,255,255,.1);
  border-radius:8px;margin-bottom:12px;overflow:hidden}
.prog-fill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--c),var(--b));transition:width .4s}
.coach-row{width:100%;max-width:720px;display:flex;align-items:flex-end;gap:8px;margin-bottom:10px}
.bubble{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.15);
  border-radius:14px 14px 14px 3px;padding:8px 13px;font-size:.8rem;font-weight:700;flex:1}
.diff-tag{align-self:flex-start;display:inline-flex;align-items:center;gap:4px;
  border:1px solid;border-radius:50px;padding:3px 10px;font-size:.7rem;font-weight:700;margin-bottom:10px}
.q-card{width:100%;max-width:720px;background:var(--card);border:1px solid var(--border);
  border-radius:24px;padding:20px 18px;text-align:center;margin-bottom:14px;
  animation:popIn .28s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{from{transform:scale(.84);opacity:0}to{transform:scale(1);opacity:1}}
.q-lbl{font-size:.72rem;color:var(--dim);font-weight:700;letter-spacing:.06em;margin-bottom:10px}
.fruit-row{display:flex;align-items:center;justify-content:center;gap:8px;margin:8px 0 12px;flex-wrap:wrap}
.f-grp{display:flex;flex-direction:column;align-items:center;gap:3px}
.f-items{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;max-width:150px}
.f-it{font-size:clamp(1.1rem,3.5vw,1.6rem);animation:fPop .25s cubic-bezier(.34,1.56,.64,1) both}
@keyframes fPop{from{transform:scale(0) rotate(-15deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.f-lbl{font-size:.63rem;color:var(--dim);font-weight:700}
.f-op{font-size:1.5rem;color:var(--y);font-weight:900;font-family:var(--fd)}
.q-expr{font-family:var(--fd);font-size:clamp(1.9rem,8vw,2.9rem);font-weight:800;
  display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.q-op{color:var(--y)}
.q-blank{min-width:50px;border-bottom:4px solid var(--c);display:inline-flex;
  align-items:center;justify-content:center;color:var(--c);
  font-size:clamp(1.7rem,7vw,2.5rem);transition:color .2s;padding:0 4px}
.hint{font-size:.76rem;color:var(--dim);margin-top:8px;font-style:italic}
.ans-grid{width:100%;max-width:720px;display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin:0 auto 16px}
.ans-btn{background:var(--card);border:3px solid var(--border);border-radius:28px;
  padding:0;height:130px;width:100%;font-family:var(--fd);font-size:3rem;
  font-weight:800;color:var(--text);cursor:pointer;transition:transform .1s;
  display:block;text-align:center;line-height:130px}
.ans-btn:active{transform:scale(.9)}
.ans-btn.ok{background:rgba(107,203,119,.28);border-color:var(--g);color:var(--g);animation:cPop .3s ease}
.ans-btn.ng{background:rgba(255,71,87,.2);border-color:var(--r);color:var(--r);animation:wShake .3s ease}
@keyframes cPop{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes wShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.numpad{width:100%;max-width:720px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 auto 12px}
.np-btn{background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:18px;min-height:64px;font-family:var(--fd);font-size:1.6rem;font-weight:800;
  color:var(--text);cursor:pointer;transition:transform .1s;display:flex;align-items:center;justify-content:center}
.np-btn:active{transform:scale(.9)}
.np-del{color:var(--r)}
.np-ok{background:var(--g);color:#111;border-color:var(--g)}

/* ── FEEDBACK SHEET (bottom drawer) ── */
.fb-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.65);
  display:flex;flex-direction:column;justify-content:flex-end;
  animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.fb-sheet{background:#141428;border:1px solid var(--border);
  border-radius:28px 28px 0 0;padding:20px 18px 0;
  display:flex;flex-direction:column;gap:10px;
  max-height:82vh;animation:slideUp .26s cubic-bezier(.34,1.1,.64,1)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.fb-top{display:flex;align-items:center;gap:12px;flex-shrink:0}
.fb-verdict{font-family:var(--fd);font-size:1.5rem;font-weight:800}
.fb-wrong-ans{font-size:.88rem;color:var(--dim);margin-top:2px}
.fb-streak{display:inline-block;border-radius:50px;padding:3px 14px;
  font-family:var(--fd);font-size:.85rem;font-weight:800;margin-top:4px}
.fb-steps-title{font-size:.72rem;font-weight:800;color:var(--dim);
  letter-spacing:.07em;text-transform:uppercase;flex-shrink:0}
.fb-steps{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  border-radius:16px;padding:14px 12px;display:flex;flex-direction:column;gap:12px;
  overflow-y:auto;flex-shrink:1;min-height:0}
.fb-step{display:flex;align-items:flex-start;gap:9px;font-size:.92rem;line-height:1.55;
  animation:stepIn .22s ease both}
.fb-step b{color:var(--y);font-weight:800}
@keyframes stepIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:translateX(0)}}
.step-n{background:rgba(255,255,255,.13);border-radius:50%;width:22px;height:22px;
  display:flex;align-items:center;justify-content:center;
  font-size:.72rem;font-weight:800;flex-shrink:0;color:var(--y)}
.fb-voice-row{display:flex;align-items:center;gap:8px;flex-shrink:0}
.v-btn{background:rgba(78,205,196,.15);border:1px solid rgba(78,205,196,.4);
  border-radius:50px;padding:8px 16px;font-family:var(--fb);font-size:.82rem;
  font-weight:800;color:var(--c);cursor:pointer;display:flex;align-items:center;gap:6px;flex-shrink:0}
.v-btn:active{transform:scale(.93)}
.v-prog{flex:1;height:4px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden}
.v-bar{height:100%;background:var(--c);width:0%;border-radius:4px;transition:none}
.waves{display:flex;align-items:center;gap:2px;height:14px}
.waves span{display:block;width:3px;border-radius:2px;background:var(--c);
  animation:wave .8s ease-in-out infinite}
.waves span:nth-child(2){animation-delay:.12s}
.waves span:nth-child(3){animation-delay:.24s}
.waves span:nth-child(4){animation-delay:.36s}
@keyframes wave{0%,100%{height:3px}50%{height:13px}}
.fb-next{background:linear-gradient(135deg,var(--y),var(--o));color:#111;
  border:none;border-radius:50px;padding:16px 0;font-family:var(--fd);
  font-size:1.05rem;font-weight:800;cursor:pointer;width:100%;
  flex-shrink:0;margin-bottom:max(env(safe-area-inset-bottom),16px)}
.fb-next:active{transform:scale(.96)}

/* ── RESULT ── */
.result-card{background:var(--card);border:1px solid var(--border);border-radius:26px;
  padding:28px 22px;text-align:center;width:100%;max-width:400px;margin-top:16px}
.result-score{font-family:var(--fd);font-size:3rem;font-weight:900;
  background:linear-gradient(135deg,var(--y),var(--o));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin:6px 0}
.result-stars{font-size:1.8rem;letter-spacing:5px;margin:4px 0}
.btn-main{background:linear-gradient(135deg,var(--y),var(--o));color:#111;border:none;
  border-radius:50px;padding:13px 28px;font-family:var(--fd);font-size:1rem;font-weight:800;
  cursor:pointer;width:100%;max-width:250px;margin:5px auto;display:block;transition:transform .13s}
.btn-main:active{transform:scale(.94)}
.btn-sec{background:var(--card);border:1px solid var(--border);color:var(--text);
  border-radius:50px;padding:11px 24px;font-family:var(--fd);font-size:.95rem;font-weight:800;
  cursor:pointer;width:100%;max-width:250px;margin:5px auto;display:block;transition:transform .13s}
.btn-sec:active{transform:scale(.95)}

/* confetti */
.cf-wrap{position:fixed;inset:0;pointer-events:none;z-index:300;overflow:hidden}
.cf{position:absolute;animation:cfFall linear forwards}
@keyframes cfFall{0%{transform:translateY(-10px) rotate(0);opacity:1}100%{transform:translateY(105vh) rotate(720deg);opacity:0}}

/* concept panel */
.concept{width:100%;max-width:480px;background:var(--card);border:1px solid var(--border);
  border-radius:16px;padding:12px 14px;margin-bottom:10px}
.concept-t{font-size:.7rem;color:var(--dim);font-weight:700;margin-bottom:6px}
.concept-d{display:flex;flex-wrap:wrap;gap:5px}
.c-grp{display:flex;gap:3px;align-items:center}
.c-dot{font-size:clamp(.85rem,2.8vw,1.2rem)}
.c-sep{color:var(--dim);font-size:.88rem;margin:0 2px}

/* ── New module styles ── */
/* Word problems */
.wp-scene{background:rgba(255,255,255,.04);border-radius:14px;padding:14px;margin:8px 0 12px;text-align:center;min-height:80px}
.wp-scene-row{font-size:1.6rem;line-height:1.6;display:flex;flex-wrap:wrap;justify-content:center;gap:2px}
.wp-scene-plus{font-size:1.3rem;color:var(--y);font-weight:900;margin:4px 0}
.wp-emoji-big{font-size:3.2rem;display:inline-block}
.wp-em{font-size:1.6rem}
.wp-text{font-size:.96rem;line-height:1.6;color:var(--text);background:rgba(255,217,61,.08);border-left:3px solid var(--y);padding:10px 12px;border-radius:8px;text-align:left;margin:8px 0 4px}
/* Number sense */
.sense-cmp{display:flex;align-items:center;justify-content:center;gap:18px;margin:18px 0}
.sense-num{font-family:var(--fd);font-size:3.5rem;font-weight:900;color:var(--c);background:rgba(78,205,196,.1);width:90px;height:90px;display:flex;align-items:center;justify-content:center;border-radius:18px;border:2px solid var(--c)}
.sense-op{font-family:var(--fd);font-size:3rem;font-weight:900;color:var(--y);min-width:50px;text-align:center}
.ten-frame{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;width:100%;max-width:240px;margin:14px auto;padding:6px;background:rgba(255,255,255,.04);border-radius:8px}
.ten-cell{aspect-ratio:1;border:2px solid var(--border);border-radius:6px;background:transparent}
.ten-cell.f{background:var(--y);border-color:var(--y)}
.num-row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0;padding:8px}
.num-bubble{font-family:var(--fd);font-size:2rem;font-weight:900;background:rgba(78,205,196,.15);color:var(--c);width:60px;height:60px;display:flex;align-items:center;justify-content:center;border-radius:50%;border:2px solid var(--c)}
.big-num{font-family:var(--fd);font-size:5rem;font-weight:900;text-align:center;color:var(--y);margin:14px 0;line-height:1}
.pv-row{display:flex;justify-content:center;gap:14px;margin:14px 0}
.pv-cell{background:rgba(255,255,255,.06);border:2px solid var(--border);border-radius:14px;padding:10px 18px;min-width:80px;text-align:center}
.pv-lbl{font-size:.74rem;color:var(--dim);font-weight:700}
.pv-val{font-family:var(--fd);font-size:2rem;font-weight:900;margin-top:3px}
.estimate-cloud{font-size:1.1rem;line-height:1.4;text-align:center;padding:14px;background:rgba(255,217,61,.06);border-radius:14px;max-width:300px;margin:8px auto;letter-spacing:1px}
.estimate-dot{display:inline-block;margin:1px}
/* Measure */
.bar-graph{display:flex;flex-direction:column;gap:6px;padding:10px;background:rgba(255,255,255,.04);border-radius:12px;margin:10px 0}
.bg-row{display:flex;gap:3px;align-items:center;font-size:1.4rem}
.bg-cell{display:inline-block}
/* Geometry */
.big-emoji{font-size:5rem;text-align:center;margin:10px 0;line-height:1.2}
.compose-q{font-family:var(--fd);font-size:1.4rem;font-weight:800;text-align:center;margin:14px 0;color:var(--c)}
/* Logic */
.pattern-row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:18px 0}
.pat-num{font-family:var(--fd);font-size:2.2rem;font-weight:900;background:rgba(78,205,196,.15);color:var(--c);width:60px;height:60px;display:flex;align-items:center;justify-content:center;border-radius:14px;border:2px solid var(--c)}
.pat-num.pat-q{color:var(--y);background:rgba(255,217,61,.15);border-color:var(--y)}
.pat-arrow{font-size:1.4rem;color:var(--dim);font-weight:900}
.oo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%;max-width:320px;margin:0 auto}
.oo-item{background:var(--card);border:2px solid var(--border);border-radius:14px;padding:18px;font-size:2.2rem;text-align:center;cursor:pointer;transition:transform .15s}
.oo-item:active{transform:scale(.94)}
.oo-item.ok{background:rgba(107,203,119,.28);border-color:var(--g);animation:cPop .3s ease}
.oo-item.ng{background:rgba(255,71,87,.2);border-color:var(--r);animation:wShake .3s ease}
.tf-stmt{font-family:var(--fd);font-size:1.4rem;font-weight:800;text-align:center;background:rgba(255,255,255,.06);border-radius:14px;padding:18px;margin:10px 0;line-height:1.4}
.hints-list{background:rgba(78,205,196,.08);border-radius:12px;padding:10px 14px;margin:10px 0}
.hint-line{font-size:.95rem;line-height:1.7;color:var(--text);font-weight:700}
/* Skip-thinking button (核心:跟着家长学讲思路开关) */
.fb-skip-btn{background:transparent;border:1px solid var(--border);color:var(--dim);
  border-radius:50px;padding:6px 14px;font-family:var(--fb);font-size:.74rem;font-weight:700;

<script>
// ═══════════════════════════════════
// AUDIO (Web Audio beeps)
// ═══════════════════════════════════
var _ac=null;
function ac(){if(!_ac)_ac=new(window.AudioContext||window.webkitAudioContext)();return _ac}
function beep(f,t,d,v){
  try{var o=ac().createOscillator(),g=ac().createGain();
  o.connect(g);g.connect(ac().destination);o.type=t;o.frequency.value=f;
  var n=ac().currentTime+d;g.gain.setValueAtTime(v||.25,ac().currentTime);
  g.gain.exponentialRampToValueAtTime(.001,n);o.start();o.stop(n+.01)}catch(e){}
}
var SFX={
  tap:function(){beep(880,'sine',.06,.15)},
  num:function(){beep(660,'triangle',.05,.12)},
  wrong:function(){beep(200,'sawtooth',.18,.28);beep(160,'sawtooth',.2,.22,.14)},
  correct:function(n){
    n=n||0;
    // Pentatonic scale ascending — bright and happy, no dissonance
    // C(523) D(587) E(659) G(784) A(880) C'(1047) D'(1175) E'(1319) G'(1568) A'(1760) C''(2093)
    var scales=[
      [523,784],
      [523,659,784],
      [523,659,784,1047],
      [523,659,784,1047,1319],
      [523,659,784,1047,1319,1568],
      [523,659,784,1047,1319,1568,1760],
      [523,659,784,1047,1319,1568,1760,2093]
    ];
    var s=scales[Math.min(n,scales.length-1)];
    try{
      var ctx=ac();
      var startT=ctx.currentTime;
      var gap=0.08;
      s.forEach(function(freq,i){
        // Each note: soft sine with gentle bell-like envelope
        var t=startT+i*gap;
        var o=ctx.createOscillator();
        var g=ctx.createGain();
        o.type='sine';
        o.frequency.value=freq;
        o.connect(g);
        g.connect(ctx.destination);
        // ADSR: quick attack, medium decay, NO harsh release
        g.gain.setValueAtTime(0,t);
        g.gain.linearRampToValueAtTime(.25,t+.015);       // attack 15ms
        g.gain.exponentialRampToValueAtTime(.001,t+.35);  // smooth decay 350ms
        o.start(t);
        o.stop(t+.4);
        // Add subtle harmonic for bell-like richness
        var o2=ctx.createOscillator();
        var g2=ctx.createGain();
        o2.type='sine';
        o2.frequency.value=freq*2;
        o2.connect(g2);
        g2.connect(ctx.destination);
        g2.gain.setValueAtTime(0,t);
        g2.gain.linearRampToValueAtTime(.06,t+.015);
        g2.gain.exponentialRampToValueAtTime(.001,t+.25);
        o2.start(t);
        o2.stop(t+.3);
      });
      // Final sparkle note held a bit longer for nice ending
      if(s.length>=3){
        var last=s[s.length-1];
        var tEnd=startT+s.length*gap;
        var oe=ctx.createOscillator(),ge=ctx.createGain();
        oe.type='sine';oe.frequency.value=last*2;
        oe.connect(ge);ge.connect(ctx.destination);
        ge.gain.setValueAtTime(0,tEnd);
        ge.gain.linearRampToValueAtTime(.12,tEnd+.02);
        ge.gain.exponentialRampToValueAtTime(.001,tEnd+.6);
        oe.start(tEnd);oe.stop(tEnd+.65);
      }
    }catch(e){}
  },
  done:function(){[523,659,784,659,784,1047].forEach(function(f,i){beep(f,'sine',.18,.35,i*.1)})}
};
document.addEventListener('touchstart',function(){try{ac().resume()}catch(e){}},{once:true});

// ═══════════════════════════════════
// SPEECH — Smart iOS voice + Google fallback
// ═══════════════════════════════════
// Strategy:
//   - VOICE_ENGINE = 'system' | 'google'
//   - 'system': Web Speech API. Picks best Chinese voice on the device.
//               On iPad Safari, downloaded "Premium/Enhanced" voices score highest.
//               iOS Chrome can NOT access these — must use Safari for best quality.
//   - 'google': Google Translate TTS (online; may be slow/blocked in some networks)
//   - User can override the auto-pick via diagnostic panel; selection saved to localStorage
var _allVoices=[];
var _bestVoice=null;
var VOICE_NAME=(function(){try{return localStorage.getItem('voiceName')||''}catch(e){return ''}})();
function setVoiceName(n){VOICE_NAME=n||'';try{localStorage.setItem('voiceName',VOICE_NAME)}catch(e){}}

function isCantonese(v){return /cantonese|yue|zh-HK|hong.?kong/i.test((v.name||'')+' '+(v.lang||''))}
function scoreVoice(v){
  var n=v.name||'',l=v.lang||'';
  if(isCantonese(v))return -1;
  if(!l.startsWith('zh'))return -1;
  var s=0;
  if(l==='zh-CN'||l==='zh-Hans'||l==='zh-Hans-CN')s+=100;
  else s+=20;
  // Premium/Enhanced/Neural — these are downloaded high-quality voices
  if(/premium|enhanced|neural|高清|增强/i.test(n))s+=200;
  // Known good female mainland Mandarin voices
  if(/tingting|ting-ting|婷婷/i.test(n))s+=80;
  if(/xiaoxiao|xiaoyi|xiaomo|晓晓|晓伊/i.test(n))s+=80;
  if(/sinji|思琪|li-mu|li mu/i.test(n))s+=70;
  if(/yating|meijia|美佳|雅婷|语嫣|yaoyao/i.test(n))s+=70;
  if(/female|woman|girl|女/i.test(n))s+=30;
  return s;
}

function loadVoices(){
  if(!window.speechSynthesis)return;
  _allVoices=window.speechSynthesis.getVoices()||[];
  // Honor user's manual choice if it's in the list
  if(VOICE_NAME){
    var picked=_allVoices.find(function(v){return v.name===VOICE_NAME});
    if(picked){_bestVoice=picked;return}
  }
  var zh=_allVoices.filter(function(v){return scoreVoice(v)>0}).sort(function(a,b){return scoreVoice(b)-scoreVoice(a)});
  _bestVoice=zh[0]||null;
}

function listChineseVoices(){
  if(!window.speechSynthesis)return [];
  var vs=window.speechSynthesis.getVoices()||[];
  return vs.filter(function(v){return scoreVoice(v)>0}).sort(function(a,b){return scoreVoice(b)-scoreVoice(a)});
}

if(window.speechSynthesis){
  loadVoices();
  window.speechSynthesis.onvoiceschanged=loadVoices;
  // iOS Safari sometimes needs nudges — retry several times
  [200,800,2000,4000].forEach(function(d){setTimeout(loadVoices,d)});
}

var VOICE_ENGINE=(function(){
  try{var v=localStorage.getItem('voiceEngine');return (v==='google'||v==='system')?v:'system'}catch(e){return 'system'}
})();
function setVoiceEngine(e){VOICE_ENGINE=e;try{localStorage.setItem('voiceEngine',e)}catch(err){}}

var _playingAudio=null;

function stopSpeech(){
  if(_playingAudio){try{_playingAudio.pause();_playingAudio.src=''}catch(e){}_playingAudio=null}
  if(window.speechSynthesis)window.speechSynthesis.cancel();
}

function speak(text,onEnd){
  stopSpeech();
  if(VOICE_ENGINE==='google') speakGoogle(text,onEnd);
  else speakSystem(text,onEnd);
}

// System voice (Web Speech API)
// specificVoiceName: optional override (used by diagnostic preview)
function speakSystem(text,onEnd,specificVoiceName){
  if(!window.speechSynthesis){if(onEnd)onEnd();return}
  window.speechSynthesis.cancel();
  setTimeout(function(){
    var u=new SpeechSynthesisUtterance(text);
    u.lang='zh-CN';u.rate=.9;u.pitch=1.05;u.volume=1;
    var voice=null;
    if(specificVoiceName){
      voice=_allVoices.find(function(v){return v.name===specificVoiceName});
    }
    if(!voice)voice=_bestVoice;
    if(voice)u.voice=voice;
    var done=false;
    var safe=setTimeout(function(){if(!done){done=true;if(onEnd)onEnd()}},Math.max(text.length*180,3000));
    u.onend=u.onerror=function(){if(!done){done=true;clearTimeout(safe);if(onEnd)onEnd()}};
    window.speechSynthesis.speak(u);
  },80);
}

// Google Translate TTS — online, no auth, may be slow/blocked in some networks
function speakGoogle(text,onEnd){
  var url='https://translate.google.com/translate_tts?ie=UTF-8&tl=zh-CN&client=tw-ob&q='+encodeURIComponent(text);
  _playingAudio=new Audio(url);
  _playingAudio.onended=function(){if(onEnd)onEnd()};
  _playingAudio.onerror=function(){
    console.warn('[Google TTS] failed, falling back to system');
    speakSystem(text,onEnd);
  };
  _playingAudio.play().catch(function(e){
    console.warn('[Google TTS] play blocked:',e.message);
    speakSystem(text,onEnd);
  });
}

function shapeInline(kind,size){
  size=size||40;
  var s=size,half=s/2;
  switch(kind){
    case 'circle':    return '<circle cx="'+half+'" cy="'+half+'" r="'+(half-2)+'" fill="#FF6B9D"/>';
    case 'triangle':  return '<polygon points="'+half+',2 '+(s-2)+','+(s-2)+' 2,'+(s-2)+'" fill="#FFD93D"/>';
    case 'square':    return '<rect x="2" y="2" width="'+(s-4)+'" height="'+(s-4)+'" fill="#4CC9F0"/>';
    case 'rectangle': return '<rect x="2" y="'+(half-half/2)+'" width="'+(s-4)+'" height="'+half+'" fill="#6BCB77"/>';
    case 'star':      return '<polygon points="'+half+',2 '+(half+5)+','+(half-5)+' '+(s-2)+','+(half-3)+' '+(half+7)+','+(half+3)+' '+(half+10)+','+(s-2)+' '+half+','+(half+8)+' '+(half-10)+','+(s-2)+' '+(half-7)+','+(half+3)+' 2,'+(half-3)+' '+(half-5)+','+(half-5)+'" fill="#C77DFF"/>';
    case 'heart':     return '<path d="M'+half+' '+(s-4)+' Q-2 '+(half-2)+' '+(half-7)+' 6 Q'+half+' 14 '+half+' '+(half-2)+' Q'+half+' 14 '+(half+7)+' 6 Q'+(s+2)+' '+(half-2)+' '+half+' '+(s-4)+'" fill="#FF4757"/>';
    case 'hexagon':   var pts=[],r=half-2;for(var i=0;i<6;i++){var a=Math.PI/3*i-Math.PI/2;pts.push((half+r*Math.cos(a)).toFixed(1)+','+(half+r*Math.sin(a)).toFixed(1))}return '<polygon points="'+pts.join(' ')+'" fill="#FF6B35"/>';
  }
  return '';
}
function shapeSVG(kind,size){
  return '<svg viewBox="0 0 '+size+' '+size+'" style="width:'+size+'px;height:'+size+'px;display:block;margin:14px auto;background:rgba(255,255,255,.04);border-radius:14px;padding:6px;box-sizing:border-box">'
    +shapeInline(kind,size-12)
    +'</svg>';
}

function clockSVG(h,m){
  // Clock face 200x200
  var hAngle=((h%12)+m/60)*30 - 90; // 12 = -90, 3 = 0
  var mAngle=m*6 - 90;
  var hRad=hAngle*Math.PI/180, mRad=mAngle*Math.PI/180;
  var hx=100+50*Math.cos(hRad), hy=100+50*Math.sin(hRad);
  var mx=100+72*Math.cos(mRad), my=100+72*Math.sin(mRad);
  // 12 numbers around the clock
  var nums='';
  for(var i=1;i<=12;i++){
    var a=(i*30-90)*Math.PI/180;
    var x=100+82*Math.cos(a),y=100+82*Math.sin(a)+6;
    nums+='<text x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" text-anchor="middle" font-size="14" font-weight="800" fill="#fff" font-family="Baloo 2">'+i+'</text>';
  }
  return '<svg viewBox="0 0 200 200" style="width:160px;height:160px;display:block;margin:8px auto">'
    +'<circle cx="100" cy="100" r="92" fill="#fff" stroke="#FFD93D" stroke-width="6"/>'
    +'<circle cx="100" cy="100" r="86" fill="#0d0d1e"/>'
    +nums
    +'<line x1="100" y1="100" x2="'+hx.toFixed(1)+'" y2="'+hy.toFixed(1)+'" stroke="#FF6B35" stroke-width="6" stroke-linecap="round"/>'
    +'<line x1="100" y1="100" x2="'+mx.toFixed(1)+'" y2="'+my.toFixed(1)+'" stroke="#4CC9F0" stroke-width="3" stroke-linecap="round"/>'
    +'<circle cx="100" cy="100" r="5" fill="#FFD93D"/>'
    +'</svg>';
}

function numberLineSVG(target,max){
  var W=280,M=20,L=W-2*M;
  var ticks='';
  var step=Math.max(1,Math.floor(max/10));
  for(var i=0;i<=max;i+=step){
    var x=M+(i/max)*L;
    ticks+='<line x1="'+x+'" y1="40" x2="'+x+'" y2="55" stroke="#888" stroke-width="2"/>';
    ticks+='<text x="'+x+'" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" font-family="Baloo 2">'+i+'</text>';
  }
  var tx=M+(target/max)*L;
  return '<svg viewBox="0 0 '+W+' 90" style="width:100%;max-width:300px;display:block;margin:14px auto">'
    +'<line x1="'+M+'" y1="48" x2="'+(W-M)+'" y2="48" stroke="#fff" stroke-width="3"/>'
    +ticks
    +'<circle cx="'+tx+'" cy="48" r="9" fill="#FF4757"/>'
    +'<circle cx="'+tx+'" cy="48" r="4" fill="#fff"/>'
    +'</svg>';
}

function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function tier(i){return i<3?'easy':i<7?'mid':'hard'}

function genAdd(lv,t){
  var op=lv.ops[rnd(0,lv.ops.length-1)];
  var rMax=lv.rng[1],rMin=lv.rng[0];
  if(t==='easy')rMax=Math.min(rMax,Math.floor(lv.max*.55));
  var a,b,ans,x=0;
  do{x++;
    if(op==='+'){a=rnd(rMin,Math.min(rMax,lv.max-1));b=rnd(1,Math.min(rMax,lv.max-a));ans=a+b}
    else{a=rnd(Math.max(rMin+1,2),rMax);b=rnd(1,a-1);ans=a-b}
  }while((ans<=0||ans>lv.max)&&x<40);
  return{a,b,op:op==='+'?'+':'−',ans,type:'add',lv,adds:[a,b]};
}
function gen3(lv){
  var a,b,c,x=0;
  do{x++;a=rnd(1,Math.min(4,lv.max-2));b=rnd(1,Math.min(4,lv.max-a-1));c=rnd(1,Math.min(3,lv.max-a-b))
  }while((a+b+c>lv.max)&&x<40);
  return{a,b,c,op:'+',ans:a+b+c,type:'add3',lv,adds:[a,b,c]};
}
function genMul(lv,t){
  var op=lv.ops[rnd(0,lv.ops.length-1)];
  var bMax=t==='easy'?5:t==='mid'?7:9,bMin=2;
  var a,b,ans;
  if(op==='×'){a=rnd(lv.tbl[0],lv.tbl[1]);b=rnd(bMin,bMax);ans=a*b}
  else{b=rnd(lv.tbl[0],lv.tbl[1]);ans=rnd(bMin,bMax);a=b*ans}
  return{a,b,op:op==='×'?'×':'÷',ans,type:'mul',lv};
}

function genWord(lv){
  var bank=WP_BANKS[lv.bank];
  if(!bank||bank.length===0)return null;
  var tpl=bank[rnd(0,bank.length-1)];
  var data=tpl.mk();
  var text=tpl.t;
  // Substitute placeholders
  text=text.replace(/\{a\}/g,data.a).replace(/\{b\}/g,data.b);
  if(data.c!==undefined)text=text.replace(/\{c\}/g,data.c);
  return Object.assign({type:'word',lv:lv,scene:tpl.sc,text:text},data);
}

// ── Number Sense Generators ──
function genSense(lv,i){
  var sub=lv.sub,rng=lv.rng||[1,20];
  if(sub==='count10'){
    var n=rnd(1,10);
    var emojis=['🍎','🌟','🐱','🌸','⭐'];
    var em=emojis[rnd(0,emojis.length-1)];
    return{type:'sense',sub:'count10',lv:lv,n:n,emoji:em,ans:n};
  }
  if(sub==='position'){
    var dirs=['上面','下面','左边','右边','前面','后面'];
    var d=dirs[rnd(0,dirs.length-1)];
    var items=[['🐱','🐶'],['🌟','🌙'],['🍎','🍊'],['🚗','🚌']];
    var pair=items[rnd(0,items.length-1)];
    // Q: A在B的___? 
    var relMap={'上面':'下面','下面':'上面','左边':'右边','右边':'左边','前面':'后面','后面':'前面'};
    return{type:'sense',sub:'position',lv:lv,a:pair[0],b:pair[1],rel:d,ans:d,choices:dirs.slice(0,4)};
  }
  if(sub==='rmb'){
    // 人教版一年级：认识元角分，简单换算
    var variants=[
      function(){var y=rnd(1,9);return{type:'sense',sub:'rmb',lv:lv,ask:'换算',q:y+'元 = ?角',ans:y*10,choices:[y*10,y*10+1,y*10-1,y*10+5]}},
      function(){var j=rnd(1,9);return{type:'sense',sub:'rmb',lv:lv,ask:'换算',q:j+'角 = ?分',ans:j*10,choices:[j*10,j*10+5,j*10-5,j*10+1]}},
      function(){var a=rnd(1,5),b=rnd(1,5);return{type:'sense',sub:'rmb',lv:lv,ask:'合计',q:a+'元'+b+'角 共多少角？',ans:a*10+b,choices:[a*10+b,a*10,a+b,a*10+b+1]}},
      function(){var a=rnd(2,9),pay=Math.ceil(a/10)*10;return{type:'sense',sub:'rmb',lv:lv,ask:'找零',q:'买了'+a+'角的糖，给1元，找回几角？',ans:10-a,choices:[10-a,a,10+a,10-a+1]}},
      function(){var coins=[1,2,5,10,20,50,100];var a=coins[rnd(0,4)],b=coins[rnd(0,3)];return{type:'sense',sub:'rmb',lv:lv,ask:'合计',q:a+'分＋'+b+'分 共多少分？',ans:a+b,choices:[a+b,a*b,a-b<0?b-a:a-b,(a+b+1)]}},
    ];
    return variants[rnd(0,variants.length-1)]();
  }
  if(sub==='compare'){
    var a=rnd(rng[0],rng[1]),b=rnd(rng[0],rng[1]);
    while(a===b)b=rnd(rng[0],rng[1]);
    return{type:'sense',sub:'compare',lv:lv,a:a,b:b,ans:a>b?'>':'<',choices:['>','<','=']};
  }
  if(sub==='numberline'){
    var max=rng[1],a=rnd(rng[0]+1,max-1);
    return{type:'sense',sub:'numberline',lv:lv,target:a,max:max,ans:a};
  }
  if(sub==='maketen'){
    var a=rnd(1,9);
    return{type:'sense',sub:'maketen',lv:lv,a:a,ans:10-a};
  }
  if(sub==='order'){
    var n=4,nums=[],used={};
    while(nums.length<n){var x=rnd(rng[0],rng[1]);if(!used[x]){used[x]=1;nums.push(x)}}
    var sorted=nums.slice().sort(function(p,q){return p-q});
    return{type:'sense',sub:'order',lv:lv,nums:nums,ans:sorted};
  }
  if(sub==='placevalue'){
    var n=rnd(rng[0],rng[1]);
    var tens=Math.floor(n/10),ones=n%10;
    var v=rnd(0,1);
    if(v===0)return{type:'sense',sub:'placevalue',lv:lv,n:n,ask:'tens',ans:tens,tens:tens,ones:ones};
    return{type:'sense',sub:'placevalue',lv:lv,n:n,ask:'ones',ans:ones,tens:tens,ones:ones};
  }
  if(sub==='estimate'){
    var actual=rnd(8,40);
    var nearest10=Math.round(actual/10)*10;
    var choices=[Math.max(5,nearest10-10),nearest10,nearest10+10];
    return{type:'sense',sub:'estimate',lv:lv,actual:actual,choices:shuffle(choices.slice()),ans:nearest10};
  }
  return null;
}

// ── Measurement Generators ──
function genMeasure(lv){
  var sub=lv.sub;
  if(sub==='compare_length'){
    var a=rnd(2,9),b=rnd(2,9);
    while(a===b)b=rnd(2,9);
    return{type:'measure',sub:'compare_length',lv:lv,a:a,b:b,ans:a>b?'A':'B'};
  }
  if(sub==='clock_hour'){
    var h=rnd(1,12);
    var v=rnd(0,1);
    if(v===0)return{type:'measure',sub:'clock_hour',lv:lv,h:h,m:0,ans:h+':00'};
    return{type:'measure',sub:'clock_hour',lv:lv,h:h,m:30,ans:h+':30'};
  }
  if(sub==='graph'){
    var cats=[['🍎',rnd(2,8)],['🍌',rnd(2,8)],['🍇',rnd(2,8)]];
    while(cats[0][1]===cats[1][1]||cats[1][1]===cats[2][1]||cats[0][1]===cats[2][1]){
      cats=[['🍎',rnd(2,8)],['🍌',rnd(2,8)],['🍇',rnd(2,8)]];
    }
    var ask=rnd(0,1)?'most':'least';
    var sorted=cats.slice().sort(function(p,q){return ask==='most'?q[1]-p[1]:p[1]-q[1]});
    return{type:'measure',sub:'graph',lv:lv,cats:cats,ask:ask,ans:sorted[0][0]};
  }
  if(sub==='clock_min'){
    var h=rnd(1,12),m=rnd(1,11)*5;
    return{type:'measure',sub:'clock_min',lv:lv,h:h,m:m,ans:h+':'+(m<10?'0'+m:m)};
  }
  if(sub==='calendar'){
    // 人教版:认识日历 — 月份天数/星期
    var months=[1,3,5,7,8,10,12];var months30=[4,6,9,11];
    var v=rnd(0,2);
    if(v===0){
      var m=months[rnd(0,months.length-1)];
      return{type:'measure',sub:'calendar',lv:lv,ask:'days',month:m,ans:31,choices:['28','29','30','31']};
    }
    if(v===1){
      var m=months30[rnd(0,months30.length-1)];
      return{type:'measure',sub:'calendar',lv:lv,ask:'days',month:m,ans:30,choices:['28','29','30','31']};
    }
    // 星期几
    var days=['星期一','星期二','星期三','星期四','星期五','星期六','星期日'];
    var today=rnd(0,6),after=rnd(1,5);
    var next=(today+after)%7;
    return{type:'measure',sub:'calendar',lv:lv,ask:'weekday',today:days[today],after:after,ans:days[next],choices:shuffle(days.slice(0,5))};
  }
  if(sub==='length_unit'){
    // 人教版二年级：认识厘米和米，选合适单位
    var items=[
      {thing:'一支铅笔',ans:'厘米',len:rnd(15,20)},
      {thing:'教室的门',ans:'米',len:rnd(2,3)},
      {thing:'一本书的厚度',ans:'厘米',len:rnd(1,3)},
      {thing:'跳绳',ans:'米',len:rnd(2,4)},
      {thing:'手指的宽度',ans:'厘米',len:1},
      {thing:'旗杆',ans:'米',len:rnd(6,10)},
      {thing:'课桌的高度',ans:'厘米',len:rnd(60,80)},
      {thing:'一张课桌',ans:'厘米',len:rnd(70,90)},
    ];
    var pick=items[rnd(0,items.length-1)];
    return{type:'measure',sub:'length_unit',lv:lv,thing:pick.thing,len:pick.len,ans:pick.ans,choices:['厘米','米','千米','毫米']};
  }
  return null;
}

// ── Geometry Generators ──
function genGeom(lv){
  var sub=lv.sub;
  var SHAPES=['circle','triangle','square','rectangle','star','heart','hexagon'];
  var SHAPE_NAMES={circle:'圆形',triangle:'三角形',square:'正方形',rectangle:'长方形',star:'星形',heart:'心形',hexagon:'六边形'};
  if(sub==='directions'){
    // 人教版:上下左右
    var scenes=[
      {q:'🐱 在 🐶 的哪边？(🐱在左，🐶在右)',ans:'左边',choices:['左边','右边','上面','下面']},
      {q:'🌟 在 ☀️ 的哪边？(🌟在上，☀️在下)',ans:'上面',choices:['左边','右边','上面','下面']},
      {q:'🍎 在桌子的 ___？',ans:'上面',choices:['上面','下面','左边','右边']},
      {q:'小猫在门的左边，小狗在小猫的哪边？',ans:'右边',choices:['左边','右边','上面','下面']},
    ];
    var pick=scenes[rnd(0,scenes.length-1)];
    return{type:'geom',sub:'directions',lv:lv,q:pick.q,ans:pick.ans,choices:pick.choices};
  }
  if(sub==='solid'){
    // 人教版:认识立体图形
    var solids=[
      {name:'正方体',emoji:'🎲',features:'6个面，都一样大',choices:['正方体','长方体','球','圆柱']},
      {name:'球',emoji:'⚽',features:'圆圆的，能滚动',choices:['正方体','球','圆柱','锥']},
      {name:'圆柱',emoji:'🥫',features:'两个圆形的面，能滚动',choices:['正方体','球','圆柱','长方体']},
      {name:'长方体',emoji:'📦',features:'6个面，对面一样大',choices:['正方体','长方体','球','圆柱']},
    ];
    var pick=solids[rnd(0,solids.length-1)];
    return{type:'geom',sub:'solid',lv:lv,name:pick.name,emoji:pick.emoji,features:pick.features,choices:shuffle(pick.choices),ans:pick.name};
  }
  if(sub==='identify'){
    var ans=SHAPES[rnd(0,4)];
    var distractors=SHAPES.filter(function(s){return s!==ans}).slice(0,3);
    return{type:'geom',sub:'identify',lv:lv,ans:ans,name:SHAPE_NAMES[ans],choices:shuffle([ans].concat(distractors))};
  }
  if(sub==='count'){
    var target=['triangle','circle','square'][rnd(0,2)];
    var counts={};
    SHAPES.slice(0,4).forEach(function(s){counts[s]=rnd(1,4)});
    counts[target]=Math.max(counts[target],2);
    return{type:'geom',sub:'count',lv:lv,target:target,name:SHAPE_NAMES[target],counts:counts,ans:counts[target]};
  }
  if(sub==='symmetry'){
    var items=[['🦋',true],['🌸',true],['❤️',true],['🍌',false],['🐟',false],['🌟',true],['🍕',false],['⭐',true]];
    var pick=items[rnd(0,items.length-1)];
    return{type:'geom',sub:'symmetry',lv:lv,emoji:pick[0],ans:pick[1]};
  }
  if(sub==='compose'){
    var qs=[
      {tri:2,opts:['正方形','圆形','五边形'],ans:'正方形'},
      {tri:6,opts:['六边形','长方形','圆形'],ans:'六边形'},
      {sq:2,opts:['长方形','三角形','圆形'],ans:'长方形'},
    ];
    var pick=qs[rnd(0,qs.length-1)];
    return Object.assign({type:'geom',sub:'compose',lv:lv},pick);
  }
  return null;
}

      {items:['🍕','🍔','🍜','⚽'],ans:'⚽',hint:'前三个是食物'},
      {items:['🌙','⭐','☀️','🐠'],ans:'🐠',hint:'前三个是天体/天空'},
      {items:['100','50','10','7'],ans:'7',hint:'100、50、10是整十/整百数'},
    ];
    var pick=sets[rnd(0,sets.length-1)];
    return{type:'logic',sub:'oddout',lv:lv,items:shuffle(pick.items.slice()),ans:pick.ans,hint:pick.hint};
  }
  if(sub==='truefalse'){
    var stmts=[
      {t:'5 + 3 比 5 大',ans:true,explain:'加法让数变大'},
      {t:'10 - 2 = 2 - 10',ans:false,explain:'减法不能交换位置'},
      {t:'3 + 4 = 4 + 3',ans:true,explain:'加法可以交换位置（交换律）'},
      {t:'7 个比 8 个多',ans:false,explain:'7 比 8 小'},
      {t:'两个 5 加起来是 10',ans:true,explain:'5 + 5 = 10'},
      {t:'9 是最大的一位数',ans:true,explain:'一位数从 0 到 9'},
      {t:'12 的十位是 2',ans:false,explain:'12 的十位是 1，个位是 2'},
      {t:'比 5 大比 8 小的数有 6 和 7',ans:true,explain:'6、7 在 5 和 8 之间'},
      {t:'0 是最小的自然数',ans:true,explain:'自然数从 0 开始'},
      {t:'20 以内最大的偶数是 18',ans:false,explain:'20 以内最大偶数是 20'},
      {t:'个位是 0 的两位数一定是整十数',ans:true,explain:'如 10、20、30…'},
      {t:'加法的结果一定比两个加数都大',ans:false,explain:'加 0 时结果不变'},
      {t:'两位数一定比一位数大',ans:true,explain:'最小两位数是 10，最大一位数是 9'},
      {t:'6 × 7 和 7 × 6 结果一样',ans:true,explain:'乘法有交换律'},
      {t:'减法可以验算：差 + 减数 = 被减数',ans:true,explain:'加减互为逆运算'},
      {t:'100 里面有 10 个 10',ans:true,explain:'10 × 10 = 100'},
      {t:'正方形的四条边一样长',ans:true,explain:'正方形四边相等'},
      {t:'5 的倍数的个位一定是 0 或 5',ans:true,explain:'5、10、15、20…的规律'},
    ];
    var pick=stmts[rnd(0,stmts.length-1)];
    return{type:'logic',sub:'truefalse',lv:lv,stmt:pick.t,ans:pick.ans,explainExtra:pick.explain};
  }
  if(sub==='classify'){
    var sets=[
      {label:'水果',right:['🍎','🍊','🍇'],wrong:'🚗'},
      {label:'动物',right:['🐶','🐱','🐰'],wrong:'🌸'},
      {label:'交通工具',right:['🚗','🚌','🚲'],wrong:'🍎'},
      {label:'文具',right:['✏️','📏','📐'],wrong:'🍕'},
      {label:'蔬菜',right:['🥕','🥦','🌽'],wrong:'🚌'},
      {label:'天气',right:['☀️','🌧️','❄️'],wrong:'🐟'},
      {label:'数学工具',right:['➕','➖','✖️'],wrong:'🌸'},
      {label:'整十数',right:['10','20','50'],wrong:'15'},
      {label:'单数',right:['1','3','7'],wrong:'4'},
      {label:'双数',right:['2','6','8'],wrong:'5'},
    ];
    var pick=sets[rnd(0,sets.length-1)];
    var items=shuffle(pick.right.concat([pick.wrong]));
    return{type:'logic',sub:'classify',lv:lv,label:pick.label,items:items,ans:pick.wrong};
  }
  if(sub==='numguess'){
    // I am between X and Y; +/- a hint
    var ans=rnd(2,18);
    var lo=Math.max(1,ans-rnd(2,4));
    var hi=Math.min(20,ans+rnd(2,4));
    var hints=['我比 '+lo+' 大，比 '+hi+' 小'];
    if(ans%2===0)hints.push('我是双数');else hints.push('我是单数');
    return{type:'logic',sub:'numguess',lv:lv,hints:hints,ans:ans,range:[lo,hi]};
  }
  return null;
}

// ── Master generator dispatch ──
function genQs(mod,lv,n){
  n=n||10;
  var arr=[];
  var kind=MODULES[mod].kind;
  var attempts=0;
  while(arr.length<n && attempts<n*4){
    attempts++;
    var t=tier(arr.length);
    var q=null;
    if(kind==='arith'){
      if(mod==='add'){
        if(t==='hard'&&lv.vis&&lv.ops.includes('+')&&Math.random()<.35) q=gen3(lv);
        else q=genAdd(lv,t);
      }else q=genMul(lv,t);
    } else if(kind==='word')   q=genWord(lv);
    else if(kind==='sense')    q=genSense(lv,arr.length);
    else if(kind==='measure')  q=genMeasure(lv);
    else if(kind==='geom')     q=genGeom(lv);
    else if(kind==='logic')    q=genLogic(lv);
    if(q) arr.push(q);
  }
  return arr;
}
function genChoices(ans,spread){
  var s=new Set([ans]);var x=0;
  while(s.size<4&&x<60){x++;var w=Math.max(0,ans+rnd(-spread,spread));if(w!==ans)s.add(w)}
  return shuffle([...s]);
}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=rnd(0,i);var t=a[i];a[i]=a[j];a[j]=t}return a}

// ═══════════════════════════════════
// EXPLANATION ENGINE
// ═══════════════════════════════════
function explain(q,correct){
  var steps=[],speech='';
  var a=q.ans,ai=q.a,bi=q.b;

  // Helper: build a visual Number Bond SVG (部分-部分-整体 图)
  function numberBond(part1,part2,whole){
    return '<svg viewBox="0 0 240 120" style="width:100%;max-width:220px;margin:4px auto;display:block">'
      +'<circle cx="120" cy="30" r="24" fill="#FFD93D" stroke="#FF6B35" stroke-width="2.5"/>'
      +'<text x="120" y="37" text-anchor="middle" font-size="22" font-weight="900" fill="#111" font-family="Baloo 2">'+whole+'</text>'
      +'<line x1="100" y1="50" x2="55" y2="75" stroke="#4ECDC4" stroke-width="2.5"/>'
      +'<line x1="140" y1="50" x2="185" y2="75" stroke="#4ECDC4" stroke-width="2.5"/>'
      +'<circle cx="50" cy="90" r="20" fill="#4CC9F0" stroke="#1E88E5" stroke-width="2.5"/>'
      +'<text x="50" y="96" text-anchor="middle" font-size="18" font-weight="900" fill="#fff" font-family="Baloo 2">'+part1+'</text>'
      +'<circle cx="190" cy="90" r="20" fill="#C77DFF" stroke="#7B1FA2" stroke-width="2.5"/>'
      +'<text x="190" y="96" text-anchor="middle" font-size="18" font-weight="900" fill="#fff" font-family="Baloo 2">'+part2+'</text>'
      +'</svg>';
  }

  // Helper: build a Bar Model SVG (条形图)
  function barModel(a,b,op){
    var total=op==='+'?a+b:a;
    var scale=200/total;
    if(op==='+'){
      var aW=a*scale,bW=b*scale;
      return '<svg viewBox="0 0 240 70" style="width:100%;max-width:240px;margin:4px auto;display:block">'
        +'<rect x="10" y="10" width="'+aW+'" height="30" fill="#4CC9F0" stroke="#1E88E5" stroke-width="2"/>'
        +'<text x="'+(10+aW/2)+'" y="30" text-anchor="middle" font-size="16" font-weight="900" fill="#fff" font-family="Baloo 2">'+a+'</text>'
        +'<rect x="'+(10+aW)+'" y="10" width="'+bW+'" height="30" fill="#C77DFF" stroke="#7B1FA2" stroke-width="2"/>'
        +'<text x="'+(10+aW+bW/2)+'" y="30" text-anchor="middle" font-size="16" font-weight="900" fill="#fff" font-family="Baloo 2">'+b+'</text>'
        +'<path d="M10 50 L10 55 L'+(10+aW+bW)+' 55 L'+(10+aW+bW)+' 50" stroke="#FFD93D" stroke-width="2" fill="none"/>'
        +'<text x="'+(10+(aW+bW)/2)+'" y="68" text-anchor="middle" font-size="15" font-weight="800" fill="#FFD93D" font-family="Baloo 2">'+(a+b)+'</text>'
        +'</svg>';
    } else {
      // Subtraction: show whole bar with "take away" portion
      var bW=b*scale,rem=(a-b)*scale;
      return '<svg viewBox="0 0 240 70" style="width:100%;max-width:240px;margin:4px auto;display:block">'
        +'<rect x="10" y="10" width="'+rem+'" height="30" fill="#6BCB77" stroke="#388E3C" stroke-width="2"/>'
        +'<text x="'+(10+rem/2)+'" y="30" text-anchor="middle" font-size="16" font-weight="900" fill="#fff" font-family="Baloo 2">'+(a-b)+'</text>'
        +'<rect x="'+(10+rem)+'" y="10" width="'+bW+'" height="30" fill="#FF4757" stroke="#C62828" stroke-width="2" stroke-dasharray="5 3" opacity=".55"/>'
        +'<text x="'+(10+rem+bW/2)+'" y="30" text-anchor="middle" font-size="16" font-weight="900" fill="#fff" font-family="Baloo 2">-'+b+'</text>'
        +'<path d="M10 50 L10 55 L'+(10+rem+bW)+' 55 L'+(10+rem+bW)+' 50" stroke="#FFD93D" stroke-width="2" fill="none"/>'
        +'<text x="'+(10+(rem+bW)/2)+'" y="68" text-anchor="middle" font-size="15" font-weight="800" fill="#FFD93D" font-family="Baloo 2">原来'+a+'</text>'
        +'</svg>';
    }
  }

  // Helper: group visualisation for multiplication
  function groupViz(groups,each){
    var rows='';
    var showG=Math.min(groups,5),showE=Math.min(each,6);
    for(var g=0;g<showG;g++){
      var row='';
      for(var e=0;e<showE;e++) row+='<span style="font-size:1.4rem;margin:1px">⭐</span>';
      rows+='<div style="display:flex;align-items:center;gap:3px;padding:2px 0">'
        +'<span style="font-size:.75rem;color:var(--dim);min-width:24px">['+(g+1)+']</span>'
        +row+'</div>';
    }
    if(groups>showG) rows+='<div style="color:var(--dim);font-size:.8rem;text-align:center">...共 '+groups+' 组</div>';
    return '<div style="background:rgba(76,201,240,.08);border-radius:12px;padding:8px 10px;margin:3px 0">'+rows+'</div>';
  }

  // ═══════════════ 加法 ═══════════════
  if(q.type==='add3'){
    var ab=ai+bi;
    steps=[
      {e:'👀',t:'<b>看一看（具象）</b>：把三个数合在一起，就是 '+ai+' + '+bi+' + '+q.c},
      {e:'🎨',t:'<b>画一画（形象）</b>：先算 '+ai+' + '+bi+' = '+ab,viz:numberBond(ai,bi,ab)},
      {e:'🧮',t:'<b>算一算（抽象）</b>：再加上 '+q.c+'，'+ab+' + '+q.c+' = '+a},
      {e:'✅',t:'答案是 <b style="color:var(--g);font-size:1.2em">'+a+'</b>'}
    ];
    speech='我们把三个数合在一起。先算'+ai+'加'+bi+'等于'+ab+'，再加上'+q.c+'，得到'+a+'。';

  } else if(q.op==='+'){
    if(ai+bi<=10){
      // Small addition — use Number Bond + counting
      steps=[
        {e:'👀',t:'<b>看一看</b>：'+ai+' 和 '+bi+' 合起来'},
        {e:'🎨',t:'<b>画一画</b>：'+ai+' 加 '+bi+' 就是把两部分合成一个整体',viz:numberBond(ai,bi,ai+bi)},
        {e:'🧮',t:'<b>算一算</b>：从 '+ai+' 开始，接着往后数 '+bi+' 个数'},
        {e:'✅',t:'答案是 <b style="color:var(--g);font-size:1.2em">'+a+'</b>'}
      ];
      speech=ai+'加'+bi+'。这是一个部分整体关系，'+ai+'和'+bi+'合起来就是一个整体。从'+ai+'开始，往后数'+bi+'个，等于'+a+'。';

    } else if(ai+bi<=20){
      var need=10-ai;
      if(need>0&&need<bi){
        // Make-ten strategy (Singapore-style)
        steps=[
          {e:'👀',t:'<b>看一看</b>：'+ai+' + '+bi+' 超过 10 了'},
          {e:'💡',t:'<b>凑十法</b>：'+ai+' 还差 '+need+' 才到 10。把 '+bi+' 拆开',viz:numberBond(need,bi-need,bi)},
          {e:'🎨',t:'<b>想一想</b>：'+ai+' 加 '+need+' 先凑成 10',viz:barModel(ai,need,'+')},
          {e:'🧮',t:'<b>算一算</b>：10 再加剩下的 '+(bi-need)+'，就是 '+a},
          {e:'✅',t:'答案是 <b style="color:var(--g);font-size:1.2em">'+a+'</b>'}
        ];
        speech=ai+'加'+bi+'。我们用凑十法，把'+bi+'拆成'+need+'和'+(bi-need)+'，'+ai+'加'+need+'先凑成10，再加'+(bi-need)+'，等于'+a+'。';
      } else {
        steps=[
          {e:'🎨',t:'<b>画一画</b>：两部分合成整体',viz:numberBond(ai,bi,a)},
          {e:'🧮',t:'<b>算一算</b>：'+ai+' + '+bi+' = '+a},
          {e:'✅',t:'答案是 <b style="color:var(--g);font-size:1.2em">'+a+'</b>'}
        ];
        speech=ai+'加'+bi+'等于'+a+'。';
      }
    } else {
      // Two-digit: split into tens and ones (Singapore place value)
      var aT=Math.floor(ai/10),aO=ai%10,bT=Math.floor(bi/10),bO=bi%10;
      steps=[
        {e:'👀',t:'<b>看一看</b>：'+ai+' + '+bi+'（两位数加法）'},
        {e:'🧩',t:'<b>拆一拆</b>：'+ai+' = '+(aT*10)+' + '+aO+'， '+bi+' = '+(bT*10)+' + '+bO},
        {e:'🔢',t:'<b>十位相加</b>：'+(aT*10)+' + '+(bT*10)+' = '+((aT+bT)*10)},
        {e:'🔢',t:'<b>个位相加</b>：'+aO+' + '+bO+' = '+(aO+bO)},
        {e:'🧮',t:'<b>合起来</b>：'+((aT+bT)*10)+' + '+(aO+bO)+' = '+a},
        {e:'✅',t:'答案是 <b style="color:var(--g);font-size:1.2em">'+a+'</b>'}
      ];
      speech=ai+'加'+bi+'。把它们拆成十位和个位，十位'+(aT*10)+'加'+(bT*10)+'等于'+((aT+bT)*10)+'，个位'+aO+'加'+bO+'等于'+(aO+bO)+'，合起来是'+a+'。';
    }

  // ═══════════════ 减法 ═══════════════
  } else if(q.op==='−'){
    if(ai<=10){
      steps=[
        {e:'👀',t:'<b>看一看</b>：原来有 '+ai+'，拿走 '+bi},
        {e:'🎨',t:'<b>画一画</b>：整体 '+ai+' 减去 '+bi+'，剩下多少',viz:barModel(ai,bi,'-')},
        {e:'💭',t:'<b>想一想</b>：'+bi+' + ? = '+ai+'，'+bi+' 再加 '+a+' 就是 '+ai},
        {e:'✅',t:'答案是 <b style="color:var(--g);font-size:1.2em">'+a+'</b>'}
      ];
      speech=ai+'减'+bi+'。我们从'+ai+'里拿走'+bi+'。也可以想'+bi+'加几等于'+ai+'，答案是'+a+'。';

    } else if(ai<=20&&ai>10&&bi>ai-10){
      // Regrouping: subtract to ten first
      var f=ai-10,s2b=bi-f;
      steps=[
        {e:'👀',t:'<b>看一看</b>：'+ai+' − '+bi+'（个位不够减）'},
        {e:'💡',t:'<b>借十法</b>：先把 '+bi+' 拆成 '+f+' 和 '+s2b,viz:numberBond(f,s2b,bi)},
        {e:'🎨',t:'<b>分两步减</b>：'+ai+' − '+f+' = 10'},
        {e:'🧮',t:'<b>再减</b>：10 − '+s2b+' = '+a},
        {e:'✅',t:'答案是 <b style="color:var(--g);font-size:1.2em">'+a+'</b>'}
      ];
      speech=ai+'减'+bi+'。个位不够减，用借十法。先把'+bi+'拆成'+f+'和'+s2b+'，'+ai+'减'+f+'得10，10再减'+s2b+'等于'+a+'。';
    } else {
      steps=[
        {e:'🎨',t:'<b>画一画</b>：整体减去一部分',viz:barModel(ai,bi,'-')},
        {e:'💭',t:'<b>想一想</b>：'+bi+' + '+a+' = '+ai},
        {e:'✅',t:'答案是 <b style="color:var(--g);font-size:1.2em">'+a+'</b>'}
      ];
      speech=ai+'减'+bi+'。想'+bi+'加几等于'+ai+'，答案是'+a+'。';
    }

  // ═══════════════ 乘法 ═══════════════
  } else if(q.op==='×'){
    steps=[
      {e:'👀',t:'<b>看一看</b>：'+bi+' 组，每组 '+ai+' 个'},
      {e:'🎨',t:'<b>画一画</b>：把星星分成 '+bi+' 行，每行 '+ai+' 个',viz:groupViz(bi,ai)},
      {e:'➕',t:'<b>等量相加</b>：就是 '+bi+' 个 '+ai+' 加起来，'+Array.from({length:Math.min(bi,4)},function(){return ai}).join('+')+(bi>4?'+...':'')+' = '+a},
      {e:'🧮',t:'<b>乘法口诀</b>：'+ai+' × '+bi+' = '+a},
      {e:'✅',t:'答案是 <b style="color:var(--g);font-size:1.2em">'+a+'</b>'}
    ];
    speech=ai+'乘以'+bi+'，意思是'+bi+'组'+ai+'，也就是'+bi+'个'+ai+'加起来，等于'+a+'。乘法口诀'+ai+'乘'+bi+'等于'+a+'，要记住哦。';

  // ═══════════════ 除法 ═══════════════
  } else if(q.op==='÷'){
    steps=[
      {e:'👀',t:'<b>看一看</b>：'+ai+' 个东西，每 '+bi+' 个一组，分几组？'},
      {e:'🎨',t:'<b>画一画</b>：分组后，可以分成 '+a+' 组',viz:groupViz(a,bi)},
      {e:'💭',t:'<b>反过来想</b>：'+bi+' × ? = '+ai+'，'+bi+' × '+a+' = '+ai},
      {e:'🧮',t:'<b>用乘法口诀</b>：'+ai+' ÷ '+bi+' = '+a},
      {e:'✅',t:'答案是 <b style="color:var(--g);font-size:1.2em">'+a+'</b>'}
    ];
    speech=ai+'除以'+bi+'。就是把'+ai+'个东西，每'+bi+'个一组，能分成'+a+'组。反过来想，'+bi+'乘'+a+'等于'+ai+'，答案是'+a+'。';
  }

  // ═══════════════ 应用题 ═══════════════
  else if(q.type==='word'){
    var op=q.op;
    if(op==='+'){
      steps=[
        {e:'👀',t:'<b>读题</b>：'+q.text},
        {e:'💡',t:'<b>找关键词</b>："一共"、"合起来"、"又来了" → 用<b>加法</b>'},
        {e:'🎨',t:'<b>画图</b>：两部分合在一起就是答案',viz:barModel(q.a,q.b,'+')},
        {e:'🧮',t:'<b>列式</b>：'+q.a+' + '+q.b+' = '+q.ans},
        {e:'✅',t:'答案是 <b style="color:var(--g);font-size:1.2em">'+q.ans+'</b>'}
      ];
      speech='这道题用加法，'+q.a+'加'+q.b+'等于'+q.ans+'。';
    } else if(op==='-'){
      var keyword=q.cmp?'"比...多/少"':(q.money?'"找回"':'"还剩"、"用了"、"飞走"');
      steps=[
        {e:'👀',t:'<b>读题</b>：'+q.text},
        {e:'💡',t:'<b>找关键词</b>：'+keyword+' → 用<b>减法</b>'},
        {e:'🎨',t:'<b>画图</b>：从总量中拿走一部分',viz:barModel(q.a,q.b,'-')},
        {e:'🧮',t:'<b>列式</b>：'+q.a+' − '+q.b+' = '+q.ans},
        {e:'✅',t:'答案是 <b style="color:var(--g);font-size:1.2em">'+q.ans+'</b>'+(q.money?' 元':'')}
      ];
      speech='这道题用减法，'+q.a+'减'+q.b+'等于'+q.ans+'。';
    } else if(op==='÷'){
      var k=q.ans;
      steps=[
        {e:'👀',t:'<b>读题</b>：'+q.text},
        {e:'💡',t:'<b>找关键词</b>："平均分"、"每人" → 用<b>除法</b>'},
        {e:'🎨',t:'<b>画图</b>：把 '+q.a+' 个东西分成 '+q.b+' 份',viz:groupViz(q.b,k)},
        {e:'🧮',t:'<b>列式</b>：'+q.a+' ÷ '+q.b+' = '+k},
        {e:'✅',t:'答案是 <b style="color:var(--g);font-size:1.2em">'+k+'</b>'}
      ];
      speech='把'+q.a+'平均分给'+q.b+'人，每人'+k+'个。';
    } else { // mix
      steps=[
        {e:'👀',t:'<b>读题</b>：'+q.text},
        {e:'💡',t:'<b>分两步走</b>：先算一部分，再算另一部分'},
        {e:'🧮',t:'<b>第一步</b>：列出已知信息'},
        {e:'🧮',t:'<b>第二步</b>：算出最后答案 = '+q.ans},
        {e:'✅',t:'答案是 <b style="color:var(--g);font-size:1.2em">'+q.ans+'</b>'}
      ];
      speech='这是多步骤问题，仔细想，答案是'+q.ans+'。';
    }
  }

  // ═══════════════ 数感 ═══════════════
  else if(q.type==='sense'){
    if(q.sub==='compare'){
      var sym=q.ans;
      steps=[
        {e:'👀',t:'<b>看数字</b>：左边 '+q.a+'，右边 '+q.b},
        {e:'💭',t:'<b>想一想</b>：'+(q.a>q.b?q.a+' 比 '+q.b+' 大':q.a+' 比 '+q.b+' 小')},
        {e:'✅',t:'答案是 '+q.a+' <b style="color:var(--g);font-size:1.4em">'+sym+'</b> '+q.b}
      ];
      speech=q.a+(q.a>q.b?'比':'比')+q.b+(q.a>q.b?'大':'小')+'，用'+(sym==='>'?'大于号':'小于号')+'。';
    } else if(q.sub==='maketen'){
      steps=[
        {e:'🎯',t:'<b>凑十法</b>：找 '+q.a+' 的好朋友'},
        {e:'🎨',t:'<b>画图</b>：'+q.a+' 还差 '+q.ans+' 个就到 10',viz:numberBond(q.a,q.ans,10)},
        {e:'✅',t:q.a+' + <b style="color:var(--g);font-size:1.2em">'+q.ans+'</b> = 10'}
      ];
      speech=q.a+'加'+q.ans+'等于10，'+q.ans+'是'+q.a+'的好朋友。';
    } else if(q.sub==='order'){
      steps=[
        {e:'👀',t:'<b>看一看</b>：要把 '+q.nums.join(', ')+' 排队'},
        {e:'💭',t:'<b>找最小</b>：'+q.ans[0]+' 最小，排第一'},
        {e:'🎯',t:'<b>依次排</b>：再找剩下里最小的'},
        {e:'✅',t:'<b style="color:var(--g);font-size:1.1em">'+q.ans.join(' < ')+'</b>'}
      ];
      speech='从小到大排：'+q.ans.join('、')+'。';
    } else if(q.sub==='placevalue'){
      steps=[
        {e:'🏠',t:'<b>数位认识</b>：'+q.n+' 这个数'},
        {e:'🔢',t:'<b>拆开看</b>：十位是 <b>'+q.tens+'</b>，个位是 <b>'+q.ones+'</b>'},
        {e:'💡',t:'<b>意思是</b>：'+q.tens+' 个十 + '+q.ones+' 个一 = '+q.n},
        {e:'✅',t:(q.ask==='tens'?'十位':'个位')+'是 <b style="color:var(--g);font-size:1.2em">'+q.ans+'</b>'}
      ];
      speech=q.n+'的十位是'+q.tens+'，个位是'+q.ones+'。';
    } else if(q.sub==='estimate'){
      steps=[
        {e:'👀',t:'<b>不要数</b>：估一下大概多少'},
        {e:'💭',t:'<b>策略</b>：找 5 个一组的小堆，看有几堆'},
        {e:'🎯',t:'<b>实际</b>：'+q.actual+' 个，最接近 '+q.ans},
        {e:'✅',t:'答案大约是 <b style="color:var(--g);font-size:1.2em">'+q.ans+'</b>'}
      ];
      speech='估算大概'+q.ans+'个，实际有'+q.actual+'个。';
    } else if(q.sub==='numberline'){
      steps=[
        {e:'📏',t:'<b>看数轴</b>：从 0 到 '+q.max},
        {e:'💭',t:'<b>找位置</b>：标记在 <b>'+q.target+'</b>'},
        {e:'✅',t:'答案是 <b style="color:var(--g);font-size:1.2em">'+q.target+'</b>'}
      ];
      speech='这个位置代表'+q.target+'。';
    }
  }

  // ═══════════════ 测量 ═══════════════
  else if(q.type==='measure'){
    if(q.sub==='compare_length'){
      steps=[
        {e:'👀',t:'<b>对齐</b>：把两条线放在一起'},
        {e:'📏',t:'<b>看长度</b>：A 长 '+q.a+'，B 长 '+q.b},
        {e:'✅',t:(q.a>q.b?'A 更长':'B 更长')+' (差 '+Math.abs(q.a-q.b)+')'}
      ];
      speech=(q.ans==='A'?'A':'B')+'更长。';
    } else if(q.sub==='clock_hour'||q.sub==='clock_min'){
      steps=[
        {e:'🕐',t:'<b>看时针</b>：指向 '+q.h},
        {e:'🕧',t:'<b>看分针</b>：指向 '+(q.m===0?'12 (整点)':q.m===30?'6 (半点)':q.m+'分')},
        {e:'✅',t:'现在是 <b style="color:var(--g);font-size:1.2em">'+q.ans+'</b>'}
      ];
      speech='现在是'+q.h+'点'+(q.m===0?'整':q.m+'分')+'。';
    } else if(q.sub==='graph'){
      steps=[
        {e:'📊',t:'<b>看图表</b>：每行有几个'},
        {e:'💭',t:'<b>'+(q.ask==='most'?'找最多':'找最少')+'</b>：比较各行长短'},
        {e:'✅',t:(q.ask==='most'?'最多的是 ':'最少的是 ')+'<b style="font-size:1.4em">'+q.ans+'</b>'}
      ];
      speech=(q.ask==='most'?'最多':'最少')+'的是'+q.ans+'。';
    }
  }

  // ═══════════════ 几何 ═══════════════
  else if(q.type==='geom'){
    if(q.sub==='identify'){
      steps=[
        {e:'👀',t:'<b>观察特征</b>：边、角、形状'},
        {e:'💡',t:'<b>'+q.name+'</b> 的特点：'+(q.ans==='circle'?'没有角，圆圆的':q.ans==='triangle'?'3 条边 3 个角':q.ans==='square'?'4 条边一样长':q.ans==='rectangle'?'4 条边，长短不同':'多个角')},
        {e:'✅',t:'答案是 <b style="color:var(--g);font-size:1.2em">'+q.name+'</b>'}
      ];
      speech='这是'+q.name+'。';
    } else if(q.sub==='count'){
      steps=[
        {e:'👀',t:'<b>找目标</b>：找'+q.name},
        {e:'🔢',t:'<b>一个一个数</b>：注意不要漏掉'},
        {e:'✅',t:'共有 <b style="color:var(--g);font-size:1.2em">'+q.ans+'</b> 个 '+q.name}
      ];
      speech=q.name+'有'+q.ans+'个。';
    } else if(q.sub==='symmetry'){
      steps=[
        {e:'🦋',t:'<b>对称的意思</b>：对折后两边一样'},
        {e:'💡',t:q.emoji+' '+(q.ans?'是':'不是')+'对称的'},
        {e:'✅',t:'答案是 <b style="color:var(--g);font-size:1.2em">'+(q.ans?'是':'不是')+'</b>'}
      ];
      speech=q.emoji+(q.ans?'是':'不是')+'对称图形。';
    } else if(q.sub==='compose'){
      steps=[
        {e:'🧩',t:'<b>拼一拼</b>：用小图形拼大图形'},
        {e:'💡',t:'<b>答案</b>：'+q.ans},
        {e:'✅',t:'答案是 <b style="color:var(--g);font-size:1.2em">'+q.ans+'</b>'}
      ];
      speech='可以拼成'+q.ans+'。';
    }
  }

  // ═══════════════ 逻辑 ═══════════════
  else if(q.type==='logic'){
    if(q.sub==='pattern'){
      var diff=q.seq[1]-q.seq[0];
      steps=[
        {e:'🔄',t:'<b>找规律</b>：每次增加多少？'},
        {e:'💭',t:'<b>规律</b>：每次 +'+diff+'，'+q.seq.join(', ')+', ?'},
        {e:'🧮',t:'<b>计算</b>：'+q.seq[2]+' + '+diff+' = '+q.ans},
        {e:'✅',t:'答案是 <b style="color:var(--g);font-size:1.2em">'+q.ans+'</b>'}
      ];
      speech='每次加'+diff+'，下一个是'+q.ans+'。';
    } else if(q.sub==='oddout'){
      steps=[
        {e:'🔍',t:'<b>找不一样</b>：观察每个的特征'},
        {e:'💡',t:'<b>分析</b>：其他都是一类，只有它不同'},
        {e:'✅',t:'答案是 <b style="font-size:1.6em">'+q.ans+'</b>'}
      ];
      speech='不一样的是这个。';
    } else if(q.sub==='truefalse'){
      steps=[
        {e:'🤔',t:'<b>判断</b>：'+q.stmt},
        {e:'💡',t:'<b>分析</b>：'+q.explainExtra},
        {e:'✅',t:'答案是 <b style="color:var(--g);font-size:1.2em">'+(q.ans?'对':'错')+'</b>'}
      ];
      speech=(q.ans?'对':'错')+'。'+q.explainExtra+'。';
    } else if(q.sub==='classify'){
      steps=[
        {e:'📦',t:'<b>分类</b>：找'+q.label+'之外的'},
        {e:'💡',t:'<b>不属于</b> '+q.label},
        {e:'✅',t:'答案是 <b style="font-size:1.6em">'+q.ans+'</b>'}
      ];
      speech='这个不是'+q.label+'。';
    } else if(q.sub==='numguess'){
      steps=[
        {e:'🕵️',t:'<b>线索</b>：'+q.hints.join('；')},
        {e:'💭',t:'<b>排除</b>：在 '+q.range[0]+' 到 '+q.range[1]+' 之间'},
        {e:'✅',t:'答案是 <b style="color:var(--g);font-size:1.2em">'+q.ans+'</b>'}
      ];
      speech='答案是'+q.ans+'。';
    }
  }

  if(!correct && q.ans!==undefined && typeof q.ans!=='object') speech='正确答案是'+q.ans+'。'+speech;
  return{steps:steps,speech:speech};
}

function show(id){
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('on')});
  document.getElementById(id).classList.add('on');
}

// HOME
// Current grade selection (persisted)
var CUR_GRADE=(function(){try{var v=localStorage.getItem('grade');return GRADES[v]?v:'G1'}catch(e){return 'G1'}})();

function renderHome(){
  var h=curHero();

    '<div style="font-size:.7rem;color:#a78bfa;font-weight:700;letter-spacing:.08em;margin-top:-2px">MATH PLANET</div>'+

  // Grade tabs
  var tabsEl=document.getElementById('gradeTabs');
  tabsEl.innerHTML=GRADE_ORDER.map(function(g){
    var info=GRADES[g];
    return '<button class="gt-btn'+(g===CUR_GRADE?' sel':'')+'" data-g="'+g+'">'
      +'<span>'+info.ico+'</span>'
      +'<span>'+info.nm+'</span>'
      +'<span class="gt-en">'+info.en+'</span>'
      +'</button>';
  }).join('');
  tabsEl.querySelectorAll('.gt-btn').forEach(function(b){
    b.onclick=function(){SFX.tap();setGrade(b.dataset.g);renderHome()};
  });

  // Module grid — show modules that have at least one level for current grade
  var grid=document.getElementById('modGrid');
  var html='';
  MOD_ORDER.forEach(function(modKey){
    var m=MODULES[modKey];
    var lvsInGrade=m.levels.filter(function(l){return l.grade===CUR_GRADE});
    if(lvsInGrade.length===0)return; // skip modules with no content for this grade
    var doneStars=lvsInGrade.reduce(function(s,l){return s+((G.prog[l.id]&&G.prog[l.id].stars)||0)},0);
    var maxStars=lvsInGrade.length*3;
    var sub=m.kind==='word'?'生活情境':m.kind==='sense'?'数感培养':m.kind==='measure'?'测量与时间':m.kind==='geom'?'图形空间':m.kind==='logic'?'思维训练':lvsInGrade[0].ds;
    html+='<div class="mod-card" data-mod="'+modKey+'">'
      +'<span class="lvc">'+lvsInGrade.length+' levels</span>'
      +'<span class="ico">'+m.icon+'</span>'
      +'<div class="nm">'+m.name+'</div>'
      +'<div class="mod-en">'+(m.en||'')+'</div>'
      +'<div class="sb">'+(doneStars>0?'⭐ '+doneStars+'/'+maxStars:sub)+'</div>'
      +'</div>';
  });
  if(html===''){
    html='<div style="grid-column:1/-1;text-align:center;padding:30px 20px;color:var(--dim);font-size:.85rem">'
      +'😊 这个年级的内容还在准备中<br>请选择其他年级'
      +'</div>';
  }
  grid.innerHTML=html;
  grid.querySelectorAll('.mod-card').forEach(function(c){
    c.onclick=function(){SFX.tap();G.mod=c.dataset.mod;renderLevels()};
  });

  var total=Object.values(G.prog).reduce(function(s,v){return s+(v.stars||0)},0);
  var el=document.getElementById('totalStars');
  el.innerHTML=total>0?'已收集<b>⭐ '+total+' 颗</b>':'点击开始冒险！';

  // Voice chooser state + handlers
  document.querySelectorAll('#voiceChooser .vc-btn').forEach(function(b){
    if(b.dataset.e===VOICE_ENGINE) b.classList.add('sel');
    else b.classList.remove('sel');
    b.onclick=function(){
      SFX.tap();
      setVoiceEngine(b.dataset.e);
      document.querySelectorAll('#voiceChooser .vc-btn').forEach(function(x){x.classList.remove('sel')});
      b.classList.add('sel');
      var testMsg={
        system:'你好，我是系统语音',
        google:'你好，我是谷歌语音'
      }[b.dataset.e];
      speak(testMsg);
    };
  });
  // Settings button
  var btnS=document.getElementById('btnSettings');
  if(btnS) btnS.onclick=function(){SFX.tap();openSettings()};
  // Knowledge map button
  var btnM=document.getElementById('btnMap');
  if(btnM) btnM.onclick=function(){SFX.tap();openKnowledgeMap();};
  show('sHome');
}

// LEVELS
function renderLevels(){
  var m=MODULES[G.mod];
  // Filter levels to current grade only
  var lvs=m.levels.filter(function(l){return l.grade===CUR_GRADE});
  document.getElementById('lvTitle').textContent=m.icon+' '+m.name;
  document.querySelector('#sLevels .s-sub').textContent=GRADES[CUR_GRADE].nm+' · 选择关卡开始挑战';
  var list=document.getElementById('lvList');
  list.innerHTML='';
  lvs.forEach(function(lv,i){
    var p=G.prog[lv.id]||{};
    var stars=p.stars||0;
    // Unlock: first level always open; others need previous level to have at least 1 star
    var locked=i>0&&!(G.prog[lvs[i-1].id]&&G.prog[lvs[i-1].id].stars);
    var card=document.createElement('div');
    card.className='lv-card'+(locked?' locked':'');
    card.innerHTML='<div class="lv-glow" style="background:'+m.color+'"></div>'
      +'<div class="lv-ico">'+(locked?'🔒':lv.ico)+'</div>'
      +'<div class="lv-inf"><div class="lv-nm">'+lv.nm+'</div>'+(lv.en?'<div class="lv-en">'+lv.en+'</div>':'')+'<div class="lv-ds">'+lv.ds+'</div></div>'
      +'<div style="text-align:right"><div class="lv-stars">'
      +(stars?'⭐'.repeat(stars)+'☆'.repeat(3-stars):'☆☆☆')+'</div>'
      +(p.best?'<div class="lv-sc" style="background:'+m.color+'">'+p.best+'分</div>':'')
      +'</div>';
    if(!locked)card.onclick=function(){SFX.tap();startGame(lv.id)};
    list.appendChild(card);
  });
  show('sLevels');
}
document.getElementById('lvBack').onclick=function(){SFX.tap();renderHome()};

// GAME
function startGame(lvId){
  // Search across all modules to find the level
  var foundMod=null,foundLv=null;
  for(var k in MODULES){
    var lv=MODULES[k].levels.find(function(l){return l.id===lvId});
    if(lv){foundMod=k;foundLv=lv;break;}
  }
  if(!foundLv)return;
  G.mod=foundMod;
  G.lv=foundLv;
  // New modules use 6 questions (shorter for younger kids), arith stays at 10
  var qCount=(MODULES[G.mod].kind==='arith')?10:6;
  G.qs=genQs(G.mod,G.lv,qCount);
  G.qi=0;G.score=0;G.correct=0;G.streak=0;G.maxStreak=0;G.input='';G.answered=false;
  nextHero();
  show('sGame');
  renderQ();
}

document.getElementById('gBack').onclick=function(){SFX.tap();stopSpeech();renderLevels()};

function renderQ(){
  if(G.qi>=G.qs.length){endGame();return}
  var q=G.qs[G.qi];
  var t=tier(G.qi);
  var pct=G.qi/G.qs.length;
  var h=curHero();

  // header
  var strPill='';
  if(G.streak>=3){var sm=STREAKS[Math.min(G.streak,7)]||STREAKS[7];
    strPill='<span class="streak-pill" style="background:'+sm.bg+';color:'+sm.c+'">'+sm.t+'</span>'}
  document.getElementById('gScore').innerHTML='⭐ '+G.score+strPill;
  document.getElementById('gProg').textContent=(G.qi+1)+'/'+G.qs.length;
  document.getElementById('gProgFill').style.width=(pct*100)+'%';

  // coach
  document.getElementById('coachHero').innerHTML=
    '<div style="filter:drop-shadow(0 0 8px '+h.suit+'88)">'+buildSVG(56,56,h,'normal')+'</div>';
  var tips=['想一想～','你一定会的！','慢慢来～','认真看一看～'];
  var coachMsg=G.streak>=5?'⚡ '+curHeroName()+'说：'+G.streak+'连击！':
    G.streak>=3?'🔥 连击'+G.streak+'次！继续！':
    q.lv.hint?'💡 '+q.lv.hint:
    q.type==='add3'?'把三个数加在一起！':
    curHeroName()+'说：'+tips[rnd(0,tips.length-1)];
  document.getElementById('coachBubble').textContent=coachMsg;

  // diff tag
  var dtEl=document.getElementById('diffTag');
  var dtMap={easy:['🌱 基础','#6BCB77'],mid:['⭐ 进阶','#FFD93D'],hard:['🔥 挑战','#FF6B35']};
  var dt=dtMap[t];
  dtEl.textContent=dt[0]+(q.type==='add3'?' · 三数相加':'');
  dtEl.style.color=dt[1];dtEl.style.borderColor=dt[1];

  // Dispatch by question type
  if(q.type==='add'||q.type==='add3'||q.type==='mul')renderArithQ(q);
  else if(q.type==='word')renderWordQ(q);
  else if(q.type==='sense')renderSenseQ(q);
  else if(q.type==='measure')renderMeasureQ(q);
  else if(q.type==='geom')renderGeomQ(q);
  else if(q.type==='logic')renderLogicQ(q);
}

// ── Arithmetic question rendering (preserved from original) ──
function renderArithQ(q){
  var cpEl=document.getElementById('conceptPanel');
  cpEl.innerHTML='';
  if(q.lv.concept&&q.type==='mul'){
    var dots='';
    if(q.op==='×'){
      for(var g=0;g<Math.min(q.b,6);g++){
        var r='';for(var d=0;d<Math.min(q.a,6);d++)r+='<span class="c-dot">⭐</span>';
        dots+='<div class="c-grp">'+r+'</div>';
        if(g<Math.min(q.b,6)-1)dots+='<span class="c-sep">+</span>';
      }
      cpEl.innerHTML='<div class="concept"><div class="concept-t">💡 '+q.b+'组，每组'+q.a+'个</div><div class="concept-d">'+dots+'</div></div>';
    }else{
      var show=Math.min(q.a,18);
      for(var i=0;i<show;i++){if(i>0&&i%q.b===0)dots+='<span class="c-sep">|</span>';dots+='<span class="c-dot">🍊</span>'}
      cpEl.innerHTML='<div class="concept"><div class="concept-t">💡 '+q.a+'个平均分，每组'+q.b+'个，分几组？</div><div class="concept-d">'+dots+'</div></div>';
    }
  }
  // visual fruits
  var fp=fruitPair(G.qi);
  var fruitHtml='';
  if((q.type==='add'||q.type==='add3')&&q.lv.vis){
    if(q.type==='add3'){
      var pairs=[fruitPair(G.qi),fruitPair(G.qi+7),fruitPair(G.qi+13)];
      fruitHtml='<div class="fruit-row">';
      q.adds.forEach(function(n,gi){
        var items='';for(var i=0;i<Math.min(n,8);i++)items+='<span class="f-it" style="animation-delay:'+(gi*8+i)*.04+'s">'+pairs[gi][0]+'</span>';
        if(gi>0)fruitHtml+='<div class="f-op">+</div>';
        fruitHtml+='<div class="f-grp"><div class="f-items">'+items+'</div><div class="f-lbl">'+n+'个'+pairs[gi][0]+'</div></div>';
      });
      fruitHtml+='</div>';
    }else if(q.op==='+'){
      var aIt='',bIt='';
      for(var i=0;i<Math.min(q.a,10);i++)aIt+='<span class="f-it" style="animation-delay:'+i*.04+'s">'+fp[0]+'</span>';
      for(var i=0;i<Math.min(q.b,10);i++)bIt+='<span class="f-it" style="animation-delay:'+(q.a+i)*.04+'s">'+fp[1]+'</span>';
      fruitHtml='<div class="fruit-row">'
        +'<div class="f-grp"><div class="f-items">'+aIt+'</div><div class="f-lbl">'+q.a+'个'+fp[0]+'</div></div>'
        +'<div class="f-op">+</div>'
        +'<div class="f-grp"><div class="f-items">'+bIt+'</div><div class="f-lbl">'+q.b+'个'+fp[1]+'</div></div>'
        +'</div>';
    }else{
      var it='';
      for(var i=0;i<Math.min(q.a,12);i++){
        var gone=i>=(q.a-q.b);
        it+='<span class="f-it" style="animation-delay:'+i*.04+'s;'+(gone?'opacity:.25;filter:grayscale(1)':'')+'">'+fp[0]+'</span>';
      }
      fruitHtml='<div class="fruit-row"><div class="f-grp"><div class="f-items">'+it+'</div><div class="f-lbl">共'+q.a+'个拿走'+q.b+'个</div></div></div>';
    }
  }
  var expr='';
  if(q.type==='add3'){
    expr='<div class="q-expr"><span>'+q.a+'</span><span class="q-op">+</span><span>'+q.b+'</span><span class="q-op">+</span><span>'+q.c+'</span><span class="q-op">=</span><span class="q-blank" id="qBlank">'+(G.input||'?')+'</span></div>';
  }else{
    expr='<div class="q-expr"><span>'+q.a+'</span><span class="q-op">'+q.op+'</span><span>'+q.b+'</span><span class="q-op">=</span><span class="q-blank" id="qBlank">'+(G.input||'?')+'</span></div>';
  }
  document.getElementById('qCard').innerHTML=
    '<div class="q-lbl">第 '+(G.qi+1)+' 题 <span class="q-lbl-en">Question '+(G.qi+1)+'</span></div>'
    +fruitHtml+expr
    +(q.lv.hint&&q.type==='mul'?'<div class="hint">💡 '+q.lv.hint+'</div>':'');

  var useNumpad=(q.ans>=20)||(q.type==='mul'&&q.a>30);
  var spread=q.ans>=50?14:q.ans>=20?7:4;
  if(useNumpad)renderNumpad(q);
  else renderChoices(q,genChoices(q.ans,spread));
}

// ── Answer choice helpers ──
function renderNumpad(q){
  var ansEl=document.getElementById('ansArea');
  var html='<div class="numpad">';
  [7,8,9,4,5,6,1,2,3].forEach(function(n){html+='<button class="np-btn" data-n="'+n+'">'+n+'</button>'});
  html+='<button class="np-btn np-del" id="npDel">⌫</button><button class="np-btn" data-n="0">0</button><button class="np-btn np-ok" id="npOk">✓</button></div>';
  ansEl.innerHTML=html;
  ansEl.querySelectorAll('.np-btn[data-n]').forEach(function(b){
    b.onclick=function(){if(G.answered)return;SFX.num();if(G.input.length<3){G.input+=b.dataset.n;document.getElementById('qBlank').textContent=G.input||'?'}}
  });
  document.getElementById('npDel').onclick=function(){G.input=G.input.slice(0,-1);document.getElementById('qBlank').textContent=G.input||'?'};
  document.getElementById('npOk').onclick=function(){if(!G.input||G.answered)return;handleAns(parseInt(G.input)===q.ans,q,null)};
}

// renderChoices(q, choices, stringMode?, ansIdx?, ansLabel?)
//   stringMode: true if choices are strings to compare directly
//   ansIdx + ansLabel: for cases where q.ans needs translating to a label (used by geom/symmetry)
function renderChoices(q,choices,stringMode,ansIdxOverride,ansLabelOverride){
  var ansEl=document.getElementById('ansArea');
  var html='<div class="ans-grid">';
  choices.forEach(function(c){html+='<button class="ans-btn" data-v="'+c+'">'+c+'</button>'});
  html+='</div>';
  ansEl.innerHTML=html;
  var ansVal=ansLabelOverride!==undefined?ansLabelOverride:q.ans;
  ansEl.querySelectorAll('.ans-btn').forEach(function(b){
    b.onclick=function(){
      if(G.answered)return;
      SFX.tap();
      var picked=b.dataset.v;
      var ok;
      if(stringMode)ok=(picked===String(ansVal));
      else ok=(parseInt(picked)===ansVal);
      handleAns(ok,q,b);
    };
  });
}

function handleAns(ok,q,btn){
  G.answered=true;
  if(ok){
    G.streak++;G.maxStreak=Math.max(G.maxStreak,G.streak);
    var tb=tier(G.qi)==='hard'?3:tier(G.qi)==='mid'?2:0;
    var sb=G.streak>=7?25:G.streak>=5?20:G.streak>=3?15:10;
    G.score+=sb+tb;G.correct++;
    if(btn)btn.classList.add('ok');
    else{var bl=document.getElementById('qBlank');if(bl)bl.style.color='var(--g)'}
    SFX.correct(G.streak-1);
  }else{
    G.streak=0;
    if(btn)btn.classList.add('ng');
    else{var bl=document.getElementById('qBlank');if(bl)bl.style.color='var(--r)'}
    if(btn)document.querySelectorAll('.ans-btn').forEach(function(b){if(parseInt(b.dataset.v)===q.ans)b.classList.add('ok')});
    SFX.wrong();
  }
  showFeedback(ok,q);
}

// FEEDBACK — bottom sheet
// ═══════════════════════════════════
function showFeedback(ok,q){
  if(ok)confetti(G.streak);
  var exp=explain(q,ok);
  var pose=ok?(G.streak>=5?'power':'victory'):'sad';
  var msg=ok?PRAISE[rnd(0,PRAISE.length-1)]:OOPS[rnd(0,OOPS.length-1)];

  // User preference: show solving thinking? (per-session toggle, default true)
  var SHOW_THINKING=(function(){try{var v=localStorage.getItem('showThinking');return v==='0'?false:true}catch(e){return true}})();

  var streakHtml='';
  if(ok&&G.streak>=3){var sm=STREAKS[Math.min(G.streak,7)]||STREAKS[7];
    streakHtml='<div class="fb-streak" style="background:'+sm.bg+';color:'+sm.c+'">'+sm.t+'</div>'}

  var stepsHtml=exp.steps.map(function(st,i){
    var vizHtml = st.viz ? '<div style="margin-top:6px">'+st.viz+'</div>' : '';
    return '<div class="fb-step" style="animation-delay:'+i*.07+'s">'
      +'<div class="step-n">'+(i+1)+'</div>'
      +'<div style="flex:1"><span style="margin-right:5px">'+st.e+'</span>'+st.t+vizHtml+'</div>'
      +'</div>';
  }).join('');

  var ansDisplay=q.ans;
  if(typeof q.ans==='object'&&q.ans!==null){
    if(Array.isArray(q.ans))ansDisplay=q.ans.join(', ');
    else ansDisplay=String(q.ans);

  var ov=document.createElement('div');

    +streakHtml+'</div>'
    +'</div>'

    +'<button class="fb-skip-btn'+(SHOW_THINKING?'':' hidden-mode')+'" id="fbSkipBtn">'
    + (SHOW_THINKING?'💡 收起解题思路':'📖 展开解题思路')
    +'</button>'
    +'<div id="fbThinkingBlock" style="display:'+(SHOW_THINKING?'flex':'none')+';flex-direction:column;gap:10px;flex-shrink:1;min-height:0">'
    +'<div class="fb-steps-title">解题思路 <span style="font-weight:700;color:#a78bfa;font-size:.68rem">Solution Steps</span></div>'

    +'<button class="v-btn" id="fbVBtn"><span id="fbVIco">🔊</span><span id="fbVLbl"> 听讲解</span></button>'

    +'</div>'
    +'</div>'
    +'<button class="fb-next" id="fbNext">'+(ok?'继续下一题 →':'再加油 →')+'</button>'
    +'</div>';

  document.body.appendChild(ov);

  // Skip-thinking toggle handler
  document.getElementById('fbSkipBtn').onclick=function(){
    SFX.tap();
    var current=localStorage.getItem('showThinking')==='0'?false:true;
    var next=!current;
    try{localStorage.setItem('showThinking',next?'1':'0')}catch(e){}
    var block=document.getElementById('fbThinkingBlock');
    var btn=document.getElementById('fbSkipBtn');
    if(next){
      block.style.display='flex';
      btn.textContent='💡 收起解题思路';
      btn.classList.remove('hidden-mode');
    }else{
      block.style.display='none';
      btn.textContent='📖 展开解题思路';
      btn.classList.add('hidden-mode');
      stopSpeech();
    }
  };

  document.getElementById('fbNext').onclick=function(){
    stopSpeech();
    ov.remove();
    G.qi++;G.input='';G.answered=false;
    renderQ();
  };

  // Voice — only auto-play if (a) thinking is shown AND (b) user hasn't disabled audio
  // Per your request: default OFF voice, manual click to play
  var playing=false;
  if(!SHOW_THINKING)return;
  var vBar=document.getElementById('fbVBar');
  var vBtn=document.getElementById('fbVBtn');
  var vIco=document.getElementById('fbVIco');
  var vLbl=document.getElementById('fbVLbl');
  if(!vBtn)return;

  function startVoice(){
    if(playing){stopSpeech();stopUI();return}
    playing=true;
    vBtn.classList.add('playing');
    vIco.innerHTML='<div class="waves"><span></span><span></span><span></span><span></span></div>';
    vLbl.textContent=' 停止';
    var est=Math.max(exp.speech.length*115,2500);
    vBar.style.transition='width '+est+'ms linear';
    vBar.style.width='100%';
    speak(exp.speech,function(){stopUI()});
  }
  function stopUI(){
    playing=false;
    vBtn.classList.remove('playing');
    vIco.textContent='🔊';
    vLbl.textContent=' 再听一次';
    vBar.style.transition='none';
    vBar.style.width='0%';
  }
  vBtn.onclick=startVoice;
  // No more setTimeout(startVoice, 350) — voice OFF by default per your request
}

function endGame(){
  var pct=G.correct/G.qs.length;
  var stars=pct>=.9?3:pct>=.7?2:pct>=.5?1:0;
  G.earnedStars=stars;
  var id=G.lv.id,prev=G.prog[id]||{};
  G.prog[id]={stars:Math.max(stars,prev.stars||0),best:Math.max(G.score,prev.best||0)};
  saveProg();
  if(stars>=2)SFX.done();

  var msgs=['再练练吧！','不错，继续加油！','很厉害！','满分！太棒了！'];
  var h=curHero();
  document.getElementById('resultCard').innerHTML=
    '<div style="'+(stars>=3?'animation:float 2s ease-in-out infinite;display:inline-block':'')+'">'
    +buildSVG(88,88,h,stars>=3?'victory':'normal')+'</div>'
    +'<div style="font-family:var(--fd);font-size:1.28rem;font-weight:800;margin-top:8px">'+G.lv.nm+'</div>'
    +(G.lv.en?'<div style="font-size:.75rem;color:var(--dim);font-weight:700;margin-top:2px">'+G.lv.en+'</div>':'')
    +'<div class="result-stars">'+'⭐'.repeat(stars)+'☆'.repeat(3-stars)+'</div>'
    +'<div class="result-score">'+G.score+' 分</div>'
    +'<div style="font-family:var(--fd);font-size:1rem;color:'+(stars>=3?'var(--y)':'var(--text)')+'">'+msgs[stars]+'</div>'
    +'<div style="color:var(--dim);font-size:.82rem;margin:6px 0 18px">答对 '+G.correct+'/10 · '+(stars>=3?'下一关已解锁！':'继续练习！')+'</div>'
    +'<button class="btn-main" id="rAgain">🔄 再挑战</button>'
    +'<button class="btn-sec" id="rBack">返回关卡</button>';

  if(stars>=2)confetti(3);
  show('sResult');
  document.getElementById('rAgain').onclick=function(){SFX.tap();startGame(G.lv.id)};
  document.getElementById('rBack').onclick=function(){SFX.tap();renderLevels()};
}
