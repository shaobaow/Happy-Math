function confetti(n){
  n=n||1;
  var wrap=document.createElement('div');wrap.className='cf-wrap';document.body.appendChild(wrap);
  var cols=['#FFD93D','#FF6B35','#4ECDC4','#FF6B9D','#C77DFF','#6BCB77','#4CC9F0'];
  var count=Math.min(25+n*8,80);
  for(var i=0;i<count;i++){
    var p=document.createElement('div');p.className='cf';
    var sz=rnd(5,12);
    p.style.cssText='left:'+rnd(0,100)+'%;background:'+cols[rnd(0,cols.length-1)]
      +';width:'+sz+'px;height:'+sz+'px;border-radius:'+(rnd(0,1)?'50%':'3px')
      +';animation-duration:'+rnd(1100,2300)+'ms;animation-delay:'+rnd(0,400)+'ms';
    wrap.appendChild(p);
  }
  setTimeout(function(){wrap.remove()},2900);
}

function openKnowledgeMap(){
  var data=KNOWLEDGE_NODES;
  var W=650,H=870;

  // Compute node states from progress
  function nodeState(id){
    var p=G.prog[id];
    if(!p||!p.stars)return'locked';
    if(p.stars>=2)return'mastered';
    return'learning';
  }

  // Build SVG
  var svgLines='',svgNodes='',svgLabels='';

  // Draw edges
  var nodeMap={};
  data.nodes.forEach(function(n){nodeMap[n.id]=n;});
  data.edges.forEach(function(e){
    var a=nodeMap[e[0]],b=nodeMap[e[1]];
    if(!a||!b)return;
    var sa=nodeState(e[0]),sb=nodeState(e[1]);
    var bothUnlocked=(sa!=='locked'||sb!=='locked');
    svgLines+='<line x1="'+a.cx+'" y1="'+a.cy+'" x2="'+b.cx+'" y2="'+b.cy+'"'
      +' stroke="'+(bothUnlocked?'rgba(255,255,255,.25)':'rgba(255,255,255,.08)')+'" stroke-width="'+(bothUnlocked?1.5:1)+'" stroke-dasharray="'+(bothUnlocked?'none':'4,4')+'"/>';
  });

  // Draw nodes
  data.nodes.forEach(function(n){
    var state=nodeState(n.id);
    var fill=state==='mastered'?n.color:state==='learning'?n.color+'88':'rgba(255,255,255,.1)';
    var stroke=state==='mastered'?'#FFD700':state==='learning'?n.color:'rgba(255,255,255,.2)';
    var glow=state==='mastered'?'filter:drop-shadow(0 0 6px '+n.color+')':'';
    var badge=state==='mastered'?'<text x="'+n.cx+'" y="'+(n.cy-n.r-3)+'" text-anchor="middle" font-size="10">✓</text>':'';
    svgNodes+='<g class="map-node" data-id="'+n.id+'" style="'+glow+'">'
      +'<circle cx="'+n.cx+'" cy="'+n.cy+'" r="'+n.r+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="2"/>'
      +(state==='mastered'?'<circle cx="'+n.cx+'" cy="'+n.cy+'" r="'+(n.r+4)+'" fill="none" stroke="'+n.color+'44" stroke-width="2"/>':'')
      +badge
      +'</g>';
    // Label (only for mastered or grade-unlocked)
    var labelY=n.cy+n.r+12;
    var labelOpacity=state==='locked'?0.3:0.85;
    svgLabels+='<text x="'+n.cx+'" y="'+labelY+'" text-anchor="middle" font-size="9.5" font-family="Baloo 2,sans-serif" font-weight="700" fill="rgba(255,255,255,'+labelOpacity+')">'+n.label+'</text>';
    if(n.labelEn){
      svgLabels+='<text x="'+n.cx+'" y="'+(labelY+11)+'" text-anchor="middle" font-size="8" font-family="Baloo 2,sans-serif" font-weight="600" fill="rgba(167,139,250,'+(state==='locked'?0.2:0.65)+')">'+n.labelEn+'</text>';
    }
  });

  // Domain group labels
  var domainLabels=[
    {x:90,y:30,label:'✦ 数与运算',color:'#4ECDC4'},
    {x:315,y:30,label:'✦ 数量关系',color:'#FF6B35'},
    {x:90,y:355,label:'✦ 图形几何',color:'#6BCB77'},
    {x:315,y:355,label:'✦ 统计实践',color:'#FF6B9D'},
  ];
  var svgDomains=domainLabels.map(function(d){
    return '<text x="'+d.x+'" y="'+d.y+'" text-anchor="middle" font-size="12" font-family="Baloo 2,sans-serif" font-weight="900" fill="'+d.color+'" opacity=".9">'+d.label+'</text>';
  }).join('');

  // Stats bar
  var total=data.nodes.length;
  var mastered=data.nodes.filter(function(n){return nodeState(n.id)==='mastered';}).length;
  var learning=data.nodes.filter(function(n){return nodeState(n.id)==='learning';}).length;

  var wrap=document.getElementById('mapSvgWrap');
  wrap.innerHTML='<div style="text-align:center;margin-bottom:8px;font-size:.78rem;color:var(--dim)">'
    +'<span style="color:#FFD700;font-weight:800">⭐ 已掌握 '+mastered+'</span>'
    +' · <span style="color:var(--c);font-weight:800">📖 学习中 '+learning+'</span>'
    +' · <span>共 '+total+' 个知识点</span>'
    +'</div>'
    +'<svg id="mapSvg" viewBox="0 0 '+W+' '+H+'" style="width:100%;max-width:'+W+'px;display:block;margin:0 auto">'
    +'<rect width="'+W+'" height="'+H+'" fill="rgba(10,10,30,.6)" rx="16"/>'
    // faint grid / star field
    +'<g opacity=".15">'
    +Array.from({length:30}).map(function(){return '<circle cx="'+rnd(0,W)+'" cy="'+rnd(0,H)+'" r="'+rnd(1,2)+'" fill="white" opacity="'+(.3+Math.random()*.7).toFixed(2)+'"/>';}).join('')
    +'</g>'
    +svgLines+svgNodes+svgLabels+svgDomains
    +'</svg>';

  // Node click → popup
  document.querySelectorAll('.map-node').forEach(function(el){
    el.onclick=function(){
      SFX.tap();
      var id=el.dataset.id;
      var node=nodeMap[id];
      if(!node)return;
      var state=nodeState(id);
      var p=G.prog[id]||{};

      // Remove existing popup
      var old=document.getElementById('mapPopup');
      if(old)old.remove();

      var stars=p.stars||0;
      var starStr=stars?'⭐'.repeat(stars)+'☆'.repeat(3-stars):'☆☆☆';
      var pop=document.createElement('div');
      pop.id='mapPopup';
      pop.className='map-popup';
      pop.innerHTML='<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">'
        +'<div>'
        +'<div class="mp-title">'+node.label+'</div>'
        +'<div class="mp-grade" style="color:'+node.color+'">'+GRADES[node.grade].nm+' · '+node.domain+'</div>'
        +'<div class="mp-desc">📚 '+node.curriculum+'</div>'
        +'</div>'
        +'<button onclick="document.getElementById(\'mapPopup\').remove()" style="background:rgba(255,255,255,.1);border:none;color:#fff;border-radius:50%;width:28px;height:28px;font-size:.9rem;cursor:pointer;flex-shrink:0">×</button>'
        +'</div>'
        +'<div class="mp-status">'
        +(state==='mastered'?'<span style="color:#FFD700;font-weight:800">✓ 已掌握</span>':state==='learning'?'<span style="color:var(--c);font-weight:800">📖 学习中</span>':'<span style="color:var(--dim);font-weight:800">🔒 待解锁</span>')
        +'<span style="margin-left:8px">'+starStr+'</span>'
        +(p.best?'<span style="margin-left:8px;font-size:.75rem;color:var(--dim)">最高 '+p.best+' 分</span>':'')
        +'</div>'
        +'<button class="mp-btn'+(state==='locked'?' locked':'')+'" id="mpGoBtn">'
        +(state==='locked'?'🔒 先完成前置关卡':'🚀 去练习这个知识点')
        +'</button>';
      document.body.appendChild(pop);

      if(state!=='locked'){
        document.getElementById('mpGoBtn').onclick=function(){
          pop.remove();
          // Find which module this level belongs to
          for(var mk in MODULES){
            var found=MODULES[mk].levels.find(function(l){return l.id===id;});
            if(found){
              G.mod=mk;
              pop.remove();
              show('sMap'); // stay on map momentarily
              // Set grade to the level's grade so it shows up
              setGrade(found.grade);
              renderLevels();
              return;
            }
          }
        };
      }

      // Close on backdrop
      pop.addEventListener('click',function(e){if(e.target===pop)pop.remove();});
    };
  });

  show('sMap');
}

function toast(msg){
  var t=document.createElement('div');
  t.className='set-toast';
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(function(){t.style.opacity='0';t.style.transition='opacity .3s'},1800);
  setTimeout(function(){t.remove()},2200);
}

// ── Save code format: MSP2-YYYYMMDD-HHMM-base64data ──
function pad(n){return n<10?'0'+n:''+n}
function makeSaveCode(){
  var d=new Date();
  var ts=d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'-'+pad(d.getHours())+pad(d.getMinutes());
  var raw=localStorage.getItem('msp2')||'{}';
  var b64;
  try{
    // Use unescape+encodeURIComponent trick to support non-ASCII (just in case)
    b64=btoa(unescape(encodeURIComponent(raw)));
  }catch(e){b64=btoa(raw)}
  return 'MSP2-'+ts+'-'+b64;
}
function parseSaveCode(code){
  code=(code||'').trim();
  // Be lenient: strip whitespace, allow code with or without prefix
  if(!/^MSP2-/.test(code))return null;
  var m=code.match(/^MSP2-(\d{8})-(\d{4})-([A-Za-z0-9+/=]+)$/);
  if(!m)return null;
  var date=m[1],time=m[2],b64=m[3];
  try{
    var raw=decodeURIComponent(escape(atob(b64)));
    var data=JSON.parse(raw);
    var totalStars=Object.values(data).reduce(function(s,v){return s+((v&&v.stars)||0)},0);
    var pretty=date.slice(0,4)+'-'+date.slice(4,6)+'-'+date.slice(6,8)+' '+time.slice(0,2)+':'+time.slice(2,4);
    return {data:data,raw:raw,when:pretty,stars:totalStars};
  }catch(e){return null}
}
function currentTotalStars(){
  try{
    var p=JSON.parse(localStorage.getItem('msp2')||'{}');
    return Object.values(p).reduce(function(s,v){return s+((v&&v.stars)||0)},0);
  }catch(e){return 0}
}

function openSettings(){
  var ov=document.createElement('div');
  ov.className='set-overlay';
  ov.innerHTML=
    '<div class="set-sheet">'
    +'<div class="set-head">'
    +'<div class="set-title">⚙️ 设置</div>'
    +'<button class="set-close" id="setClose">×</button>'
    +'</div>'
    +'<div class="set-body" id="setBody"></div>'
    +'</div>';
  document.body.appendChild(ov);
  document.getElementById('setClose').onclick=function(){SFX.tap();stopSpeech();ov.remove()};
  ov.addEventListener('click',function(e){if(e.target===ov){stopSpeech();ov.remove()}});
  renderSettingsBody(document.getElementById('setBody'));
}

function renderSettingsBody(body){
  var stars=currentTotalStars();
  body.innerHTML=
    // Section 1: Save / Restore
    '<div class="set-section">'
    +'<div class="set-section-t">📦 进度备份</div>'
    +'<div class="set-row">'
    +'<div class="set-row-t">📤 导出存档</div>'
    +'<div class="set-row-d">把当前进度（'+stars+' ⭐）打包成一段代码，复制或通过邮件发给自己，下次在新设备上导入即可恢复。</div>'
    +'<button class="set-btn" id="btnExport">生成存档码</button>'
    +'<div id="exportArea"></div>'
    +'</div>'
    +'<div class="set-row">'
    +'<div class="set-row-t">📥 导入存档</div>'
    +'<div class="set-row-d">从邮件复制存档码粘贴进来，确认后恢复进度。</div>'
    +'<textarea class="set-input" id="importInput" placeholder="MSP2-..."></textarea>'
    +'<button class="set-btn alt" id="btnImport">检查并导入</button>'
    +'<div id="importArea"></div>'
    +'</div>'
    +'</div>'
    // Section 2: Voice diagnostic
    +'<div class="set-section">'
    +'<div class="set-section-t">🔊 语音诊断与试听</div>'
    +'<div class="set-row">'
    +'<div class="set-row-t">当前可用的中文语音</div>'
    +'<div class="set-row-d">点 ▶ 试听每个语音，找到最好听的，点"用这个"锁定为默认。</div>'
    +'<div id="voiceList" class="voice-list"></div>'
    +'<div class="set-help" id="voiceHelp"></div>'
    +'</div>'
    +'</div>';

  // Export handler
  document.getElementById('btnExport').onclick=function(){
    SFX.tap();
    var code=makeSaveCode();
    var ea=document.getElementById('exportArea');
    ea.innerHTML=
      '<div class="set-code" id="setCodeBox">'+code+'</div>'
      +'<div style="display:flex;gap:8px;margin-top:8px">'
      +'<button class="set-btn alt" id="btnCopy" style="margin:0;flex:1">📋 复制存档码</button>'
      +'<button class="set-btn" id="btnEmail" style="margin:0;flex:1">📧 邮件发送</button>'
      +'</div>';
    document.getElementById('btnCopy').onclick=function(){
      SFX.tap();
      copyToClipboard(code,function(ok){toast(ok?'已复制到剪贴板':'复制失败，请长按手动复制')});
    };
    document.getElementById('btnEmail').onclick=function(){
      SFX.tap();
      var subj=encodeURIComponent('数学星球存档 '+code.split('-').slice(1,3).join(' '));
      var bodyTxt=encodeURIComponent(
        '数学星球进度存档\n'
        +'生成时间：'+new Date().toLocaleString()+'\n'
        +'当前总星星数：'+stars+' ⭐\n\n'
        +'恢复方法：在数学星球点 ⚙️ → 导入存档，把下面这串代码粘贴进去：\n\n'
        +code+'\n'
      );
      // mailto: opens mail app, user fills the recipient
      window.location.href='mailto:?subject='+subj+'&body='+bodyTxt;
    };
  };

  // Import handler
  document.getElementById('btnImport').onclick=function(){
    SFX.tap();
    var input=document.getElementById('importInput').value;
    var parsed=parseSaveCode(input);
    var ia=document.getElementById('importArea');
    if(!parsed){
      ia.innerHTML='<div class="set-help" style="border-left-color:var(--r);background:rgba(255,71,87,.08)"><b style="color:var(--r)">无法识别存档码</b><br>请确认完整复制了 MSP2- 开头的整段。</div>';
      return;
    }
    var nowStars=currentTotalStars();
    var warn=parsed.stars<nowStars?
      '<div class="set-help" style="border-left-color:var(--r);background:rgba(255,71,87,.08)"><b style="color:var(--r)">⚠️ 注意</b>：这个存档只有 '+parsed.stars+' ⭐，比当前 '+nowStars+' ⭐ 少。导入后会覆盖当前进度。</div>'
      :'';
    ia.innerHTML=
      '<div class="set-help"><b>检查通过</b><br>'
      +'存档时间：'+parsed.when+'<br>'
      +'星星数：'+parsed.stars+' ⭐<br>'
      +'当前进度：'+nowStars+' ⭐</div>'
      +warn
      +'<button class="set-btn warn" id="btnConfirmImport" style="margin-top:8px">确认导入并覆盖</button>';
    document.getElementById('btnConfirmImport').onclick=function(){
      SFX.tap();
      try{
        localStorage.setItem('msp2',parsed.raw);
        G.prog=parsed.data;
        toast('✅ 进度已恢复');
        document.getElementById('importInput').value='';
        // Re-render the settings body to reflect new star count
        setTimeout(function(){renderSettingsBody(body)},400);
      }catch(e){
        toast('保存失败：'+e.message);
      }
    };
  };

  // Voice list
  renderVoiceList();
}

function renderVoiceList(){
  var list=document.getElementById('voiceList');
  var help=document.getElementById('voiceHelp');
  if(!list)return;
  var voices=listChineseVoices();
  if(voices.length===0){
    list.innerHTML='<div style="text-align:center;color:var(--dim);padding:14px;font-size:.78rem">没有检测到中文语音</div>';
    help.innerHTML='<b>没有找到中文语音？</b><br>'
      +'1. 用 <b>Safari</b> 打开（iPad Chrome 调不到系统语音）<br>'
      +'2. iPad 设置 → 辅助功能 → 朗读内容 → 声音 → 中文 → 下载"婷婷增强版"等高级语音<br>'
      +'3. 下载完彻底关闭 Safari 再重开';
    return;
  }
  list.innerHTML=voices.map(function(v){
    var isPicked=(VOICE_NAME===v.name)||(!VOICE_NAME && _bestVoice && _bestVoice.name===v.name);
    var isPremium=/premium|enhanced|neural|高清|增强/i.test(v.name);
    return '<div class="voice-item'+(isPicked?' cur':'')+'">'
      +'<div class="voice-name">'+v.name+(isPremium?'<span class="voice-tag">⭐ 高品质</span>':'')+'<div style="font-size:.65rem;color:var(--dim)">'+v.lang+'</div></div>'
      +'<button class="voice-play" data-n="'+encodeURIComponent(v.name)+'" data-act="play">▶</button>'
      +'<button class="voice-pick'+(isPicked?' cur':'')+'" data-n="'+encodeURIComponent(v.name)+'" data-act="pick">'+(isPicked?'✓ 默认':'用这个')+'</button>'
      +'</div>';
  }).join('');
  list.querySelectorAll('button').forEach(function(b){
    b.onclick=function(){
      SFX.tap();
      var name=decodeURIComponent(b.dataset.n);
      var act=b.dataset.act;
      if(act==='play'){
        // Force system engine for preview, regardless of current setting
        stopSpeech();
        speakSystem('你好，我是数学星球的语音老师，三加五等于八',null,name);
      }else{
        setVoiceName(name);
        // Force system engine when user manually picks a voice
        setVoiceEngine('system');
        loadVoices();
        // Refresh home voice chooser display next time
        renderVoiceList();
        toast('已设为默认语音');
      }
    };
  });
  // Help text
  var pre=voices.filter(function(v){return /premium|enhanced|neural|高清|增强/i.test(v.name)});
  if(pre.length>0){
    help.innerHTML='<b>共找到 '+voices.length+' 个中文语音，其中 '+pre.length+' 个是高品质语音</b>。试听后选最喜欢的一个作为默认。';
  }else{
    help.innerHTML='<b>提示</b>：没有检测到"高品质"语音。可在 iPad 设置 → 辅助功能 → 朗读内容 → 声音 → 中文 中下载"婷婷增强版"等高级语音，下载后<b>彻底关闭 Safari 再重开</b>本页面。';
  }
}

function copyToClipboard(text,cb){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){cb(true)},function(){fallbackCopy()});
  }else{fallbackCopy()}
  function fallbackCopy(){
    try{
      var ta=document.createElement('textarea');
      ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
      document.body.appendChild(ta);ta.select();
      var ok=document.execCommand('copy');
      document.body.removeChild(ta);
      cb(ok);
    }catch(e){cb(false)}
  }
}
